        const b = document.createElement('button'); b.className = 'chip';
        const [cn, cs] = c.data.name.replace(/^[✦∑⚠↔]︎? /, '').split(' · ');
        b.innerHTML = `<i style="background:${col(c)}"></i>${esc(cn)}` + (cs ? ` <span style="font-weight:500;color:var(--muted)">${esc(cs)}</span>` : '');
        b.onclick = () => {
          H._children.forEach(o => {if (o !== c) o.children = null});
          const lim = isM() ? 2 : 3;   // điện thoại chỉ mở tới phần A/B/C để không quá tải
          (function open(n) {if (n._children) {n.children = n._children; n.children.forEach(ch => {if (ch.depth < lim) open(ch); else ch.children = null})} })(c);
          c.children = c._children; update(c); select(c, 'peek');
          chips.querySelectorAll('.chip').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'true');
          if (!document.getElementById('stage').hidden) setTimeout(() => isM() ? center(c, 1) : fitNode(c), 20);
          else openOutline(c.key)
        };
        chips.appendChild(b)
      });
      function fitNode(c) {fitTo(c.descendants().concat([H]))}

      // ---- buttons ----
      document.getElementById('bExpand').onclick = () => {collapseTo(99); update(H); fit(); buildOutline(true)};
      document.getElementById('bCollapse').onclick = () => {collapseTo(baseDepth()); hits.clear(); select(H, 'peek'); fit(); buildOutline(false)};
      document.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.4);
      document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.4);
      document.getElementById('zfit').onclick = fit;
      // ---- đổi bố cục 1 bên ⇄ 2 bên (ghi nhớ lựa chọn) ----
      const zlay = document.getElementById('zlay');
      function syncLay() {const b = layout() === 'both'; zlay.setAttribute('aria-pressed', b); zlay.title = b ? 'Bố cục: 2 bên (bấm để chuyển 1 bên)' : 'Bố cục: 1 bên (bấm để chuyển 2 bên)'}
      zlay.onclick = () => {layPref = layout() === 'both' ? 'right' : 'both'; try {localStorage.setItem(LAY_KEY, layPref)} catch (e) { }; syncLay(); update(H); fit()};
      syncLay();
      // phông Be Vietnam Pro tải xong muộn → đo lại nhãn & dàn lại cho khít
      document.fonts?.ready?.then(() => {update(H); if (!stageEl.hidden) fit()});

      // ---- search ----
      const q = document.getElementById('q'), res = document.getElementById('res');
      const all = ALL.map(d => ({d, t: norm(d.data.name), b: norm(d.data.d)}));
      q.addEventListener('input', () => {
        const s = norm(q.value.trim()); hits.clear();
        if (s.length < 2) {res.hidden = true; update(H); return }
        const r = all.filter(x => x.t.includes(s)).concat(all.filter(x => !x.t.includes(s) && x.b.includes(s))).slice(0, 40);
        r.forEach(x => hits.add(x.d.key));
        res.innerHTML = r.length ? r.map(x => `<button data-k="${x.d.key}">${esc(x.d.data.name)}<small>${esc(x.d.ancestors().reverse().slice(1, -1).map(a => lbl(a.data.name, 22)).join(' › ') || 'Gốc')}</small></button>`).join('') : '<div style="padding:8px;color:var(--muted)">Không tìm thấy</div>';
        res.hidden = false; update(H)
      });
      res.addEventListener('click', e => {
        const k = e.target.closest('[data-k]'); if (!k) return; res.hidden = true;
        if (isM()) q.blur();   // đóng bàn phím ảo để thấy kết quả
        if (document.getElementById('outline').hidden) goTo(+k.dataset.k); else openOutline(+k.dataset.k)
      });
      document.addEventListener('click', e => {if (!e.target.closest('.search')) res.hidden = true});
      q.addEventListener('keydown', e => {
        if (e.key === 'Enter') {const b = res.querySelector('button[data-k]'); if (b) {e.preventDefault(); b.click()}}
        else if (e.key === 'Escape') {res.hidden = true; q.blur()}
        else if (e.key === 'ArrowDown') {const b = res.querySelector('button'); if (b && !res.hidden) {e.preventDefault(); b.focus()}}
      });

      // ---- outline view ----
      const outWrap = document.getElementById('outWrap');
      function buildOutline(openAll) {
        function rec(d, lvl) {
          const tag = d.data.tag ? `<span class="tag ${TAGS[d.data.tag][0]}" style="margin:0 6px 0 0">${TAGS[d.data.tag][1]}</span>` : '';
          const det = d.data.d ? `<div class="od">${fmt(d.data.d, d.data.tag === 'f')}</div>` : '';
          if (!d._children) return `<div class="leaf" id="o${d.key}">${tag}<b>${esc(d.data.name)}</b>${det}</div>`;
          return `<details class="lvl${lvl}" id="o${d.key}" ${openAll || lvl < 1 ? 'open' : ''}><summary style="color:${lvl <= 1 ? col(d) : 'inherit'}">${tag}${esc(d.data.name)}</summary>${det}${d._children.map(c => rec(c, lvl + 1)).join('')}</details>`
        }
        outWrap.innerHTML = rec(H, 0);
      }
      function openOutline(key) {
        const el = document.getElementById('o' + key); if (!el) return; let p = el; while (p && p !== outWrap) {if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement}
        if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({behavior: 'smooth', block: 'start'})
      }
      buildOutline(false);
      // Khi in: dựng Dàn ý mở hết mọi nhánh; in xong trả lại trạng thái mở/đóng như cũ
      let outSnap = null;
      addEventListener('beforeprint', () => {outSnap = outWrap.innerHTML; buildOutline(true)});
      addEventListener('afterprint', () => {if (outSnap != null) {outWrap.innerHTML = outSnap; outSnap = null}});

      // ---- view toggle ----
      const vMap = document.getElementById('vMap'), vOut = document.getElementById('vOut');
      function setView(m) {
        const map = m === 'map'; document.getElementById('stage').hidden = !map; panel.hidden = !map; split.hidden = !map; document.getElementById('outline').hidden = map;
        document.body.classList.toggle('mapmode', map);   // chỉ chặn phóng to cả trang khi đang ở Sơ đồ; Dàn ý vẫn phóng to chữ được
        vMap.setAttribute('aria-pressed', map); vOut.setAttribute('aria-pressed', !map); try {localStorage.setItem('sceoView', m)} catch (e) { }
        if (map) setTimeout(fit, 30)
      }
      vMap.onclick = () => setView('map'); vOut.onclick = () => setView('out');

      // ---- hint: chữ hướng dẫn theo thiết bị, tự ẩn ----
      const hint = document.getElementById('hint');
      function hideHint() {hint.classList.add('gone')}
      hint.textContent = matchMedia('(pointer: coarse)').matches
        ? 'Chạm để mở nhánh · 1 ngón kéo để di chuyển · chụm/chạm đúp để phóng to'
        : 'Bấm để mở nhánh · kéo để di chuyển · lăn chuột hoặc nhấp đúp để phóng to';
      const setPh = () => q.placeholder = isM() ? 'Tìm khái niệm: EOQ, MAPE…' : 'Tìm: EOQ, MAPE, Kraljic…'; setPh();
      setTimeout(hideHint, isM() ? 5000 : 12000);

      update(H); select(H);
      let v = 'map'; try {v = localStorage.getItem('sceoView') || 'map'} catch (e) { }
      setView(v);
      setTimeout(fit, 60);

      // ---- đổi kích thước / xoay màn hình / chuyển qua lại mốc 820px ----
      // Chỉ căn lại khung khi ĐỔI CHIỀU RỘNG (xoay máy, kéo cửa sổ). Đổi chiều cao do bàn phím ảo hay
      // thanh địa chỉ co giãn thì giữ nguyên mức zoom/vị trí người dùng đang xem.
      let rt, lastW = innerWidth;
      window.addEventListener('resize', () => {
        clearTimeout(rt); rt = setTimeout(() => {
          if (isM() && sheetPx) panel.dataset.state === 'full' ? applySheet(maxH()) : applySheet(sheetPx);
          if (!isM()) {const w = parseInt(panel.style.getPropertyValue('--panel-w')); if (w) setPanelW(w)}
          if (Math.abs(innerWidth - lastW) > 40) {lastW = innerWidth; syncLay(); update(H); if (!document.getElementById('stage').hidden) fit()}
        }, 150)
      });
      const onMq = () => {
        if (isM()) {panel.dataset.state = ''; setSheet('peek')} else clearSheet();
        setPh(); select(selected); setTimeout(fit, 60)
      };
      mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);   // Safari ≤13 chỉ có addListener
      if (isM()) setSheet('peek');
    })();
  </script>

</body>
