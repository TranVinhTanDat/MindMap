  <script type="text/plain" id="data">
SCEO – Chuỗi cung ứng toàn diện :: Bộ 9 chương VILAS SC Essentials (song ngữ Anh–Việt). Mạch kiến thức: Tổng quan → Dữ liệu → Bán lẻ (khách hàng) → Nhu cầu & dự báo → Vận hành/sản xuất → Tồn kho → Thu mua → Rủi ro → Dịch vụ Logistics. ¶Mạch logic: hiểu KHÁCH HÀNG và NHU CẦU trước, rồi lập kế hoạch CUNG (sản xuất, tồn kho, thu mua), bảo vệ bằng QUẢN TRỊ RỦI RO, và giao hàng bằng LOGISTICS. ¶Mẹo học: mở nhánh “Liên kết xuyên chương”, “Công thức cần nhớ”, “Thuật ngữ & viết tắt” và “Lỗi slide & lỗi dịch” ở cuối để ôn nhanh trước khi thi. ¶Quy ước: nội dung theo slide gốc tiếng Anh khi bản Việt dịch lệch; phần ghi “(Bổ sung)” hoặc “(Ví dụ tự luyện)” là kiến thức thêm ngoài slide.
  C1 · Tổng quan Chuỗi cung ứng :: 3 phần: A – Tổng quan, B – Thực thi (SCOR DS), C – Thách thức & đánh đổi. ¶Kết chương: (1) Giá trị ≠ Lãng phí; (2) Vai trò & lợi ích của CCU; (3) Các quy trình trong CCU; (4) Mục tiêu tổng quát & đánh đổi.
    A · Tổng quan CCU
      Giá trị trong mắt khách hàng :: Câu hỏi: Mục đích của mọi tổ chức là gì? Lợi nhuận cho cổ đông? Tạo dòng tiền? Tối đa hóa lợi nhuận? ¶→ Đáp án của slide: TẠO RA GIÁ TRỊ. Ba phương án kia chỉ là “mồi nhử”. ¶Giá trị hướng tới 2 đối tượng: KHÁCH HÀNG (Customer) và CỘNG ĐỒNG/XÃ HỘI (Society).
      Giá trị vs Lãng phí :: • Hoạt động tạo giá trị (VA): đóng góp trực tiếp tạo ra SP/DV khách hàng mong muốn; nâng chất lượng, chức năng, hình thức. ¶• Hoạt động không tạo giá trị (NVA) = lãng phí: tiêu tốn tài nguyên, thời gian mà không đáp ứng kỳ vọng khách hàng. ¶Câu then chốt: “GIÁ TRỊ là thứ khách hàng trả tiền; LÃNG PHÍ là thứ BẠN trả tiền.”
        TIMWOODS – 8 loại lãng phí :: T – Transport (vận chuyển) ¶I – Inventory (tồn kho) ¶M – Movement/Motion (thao tác, di chuyển thừa) ¶W – Waiting (chờ đợi) ¶O – Overproduction (sản xuất thừa) ¶O – Over-processing (gia công thừa) ¶D – Defects (lỗi, khuyết tật) ¶S – Skills (lãng phí kỹ năng con người)
      Định nghĩa Quản lý CCU :: 1) “Sự liên kết các công ty tích hợp với nhau để cung cấp SP/DV ra thị trường.” ¶2) “Mọi hoạt động liên quan đến dòng chảy & chuyển đổi hàng hóa/dịch vụ từ nguyên liệu thô đến thành phẩm cho người dùng cuối.” ¶3) ASCM Dictionary: “Thiết kế, Lập kế hoạch, Thực thi, Kiểm soát và Giám sát các hoạt động CCU nhằm: tạo giá trị ròng · xây dựng hạ tầng cạnh tranh · tận dụng logistics toàn cầu · đồng bộ cung với cầu · đo lường hiệu suất toàn cầu.”
        5 động từ của ASCM :: Thiết kế (Design) → Lập kế hoạch (Plan) → Thực thi (Execute) → Kiểm soát (Control) → Giám sát (Monitor)
        5 mục tiêu của ASCM :: Giá trị ròng · Hạ tầng cạnh tranh · Logistics toàn cầu · Đồng bộ cung – cầu · Đo lường hiệu suất
      Mạng lưới cung ứng & Chuỗi giá trị :: Mạng lưới cung ứng: “Tiến bộ không phải đường thẳng” – CCU hiện đại không còn là chuỗi tuyến tính mà là MẠNG LƯỚI hợp tác, năng động; doanh nghiệp vừa là người mua vừa là nhà cung cấp; giúp nhận diện xu hướng và phản ứng trước khi vấn đề phát sinh. ¶Chuỗi giá trị: các chức năng trong công ty phối hợp để GIA TĂNG GIÁ TRỊ cho SP/DV mà khách hàng trả tiền.
      Upstream – Downstream :: Upstream: hướng về nhà cung cấp nguyên liệu thô. ¶Downstream: hướng về khách hàng cuối. ¶Chuỗi điển hình: Nhà cung ứng → Nhà sản xuất → Nhà phân phối → Nhà bán sỉ → Nhà bán lẻ → Khách hàng cuối.
      4 dòng chảy trong CCU :: 1) Sản phẩm/dịch vụ – DÒNG GIÁ TRỊ (xuôi về khách hàng) ¶2) Thanh toán – DÒNG TIỀN (ngược về nhà cung cấp) ¶3) DÒNG THÔNG TIN (hai chiều) ¶4) LOGISTICS NGƯỢC (hàng trả về, tái chế)
      Tầm quan trọng của CCU :: 3 trọng tâm: Tạo giá trị cho KH · Dịch vụ KH tốt · Cải thiện hiệu suất tổ chức. ¶• CCU ở khắp nơi, bạn làm CCU mỗi ngày. ¶• Mỗi SP/DV cần CCU riêng. ¶• Một công ty có thể có NHIỀU HƠN MỘT CCU.
        {vd} Ví dụ tiệm bánh quy ngày hội :: Các câu hỏi khi mở tiệm bánh được nhóm thành chức năng CCU: ¶• Bán hàng & Marketing → Dự báo / Order: bán vị gì, giá bao nhiêu, mỗi vị bao nhiêu? ¶• Lập kế hoạch cung ứng → Plan & Source: nướng bao nhiêu, mua nguyên liệu ở đâu, bao nhiêu, bảo quản sao? ¶• Lập kế hoạch sản xuất → Transform: nướng ở đâu, lò nướng bao nhiêu/mẻ, vị nào trước, khi nào bắt đầu? ¶• Quản lý chất lượng: tiêu chuẩn bánh đạt, giảm bánh lỗi, đóng gói chống vỡ. ¶• Kho & vận chuyển → Fulfill: lưu trữ, kiểm đếm, mang đến sự kiện, khi nào đi. ¶• Chi phí: nhân lực, nguyên liệu, nướng, lưu trữ & vận chuyển.
        {!} Lưu ý slide :: Bản tiếng Việt ghi “Lập kế hoạch sản xuất // Vận chuyển”, bản gốc là “Production Planning // TRANSFORM” (chuyển đổi/sản xuất), không phải vận chuyển.
      Đặc điểm của CCU hiệu quả :: Tăng trưởng doanh thu · Lấy khách hàng làm trung tâm · Hiệu quả chi phí & quy trình · Tối ưu sử dụng tài sản · Logistics hiệu suất cao · Giảm chi phí · Dự báo chính xác · Tinh gọn tồn kho · Hợp tác nhà cung cấp · Tích hợp quản lý CCU
    B · Thực thi CCU – Mô hình SCOR DS
      SCOR là gì? :: Mô hình tham chiếu vận hành CCU (ASCM, scor.ascm.org). Mục đích: xác định cấu trúc quy trình phù hợp với chức năng kinh doanh cốt lõi và mục tiêu tổ chức. DS = Digital Standard.
      Cấp 0 – Orchestrate (Điều phối) :: Phần DUY NHẤT ở cấp 0. Hoạt động ở mức chiến lược, hướng dẫn và ảnh hưởng tới mọi quy trình cấp 1 trở xuống. ¶Hình vô cực SCOR DS: ORCHESTRATE ở tâm; vòng trái DEMAND (Order → Fulfill); vòng phải SUPPLY (Source → Transform); PLAN ở trên (gắn với SYNCHRONIZE – đồng bộ); RETURN ở dưới (gắn với REGENERATE – tái tạo).
      SCOR là mô hình PHÂN CẤP (5 cấp) :: • Cấp 0 – Orchestrate the SC (OE): chiến lược, chi phối mọi cấp dưới. ¶• Cấp 1 – Quy trình chính (Major processes: P-O-S-T-F-R): xác định PHẠM VI, NỘI DUNG và MỤC TIÊU HIỆU SUẤT của CCU. ¶• Cấp 2 – Nhóm quy trình (Process categories), VD Order: O1 B2C · O2 B2B · O3 Nội bộ (intra-company): xác định CHIẾN LƯỢC VẬN HÀNH, năng lực quy trình. ¶• Cấp 3 – Phần tử quy trình (Process elements), VD O1: O1.1 Nhận thông tin KH · O1.2 Áp dụng hạng thành viên · O1.3 Lập đơn · O1.4 Xử lý thanh toán · O1.5 Tạo biên nhận & ngày giao · O1.6 Biên nhận & xử lý: xác định CẤU HÌNH từng quy trình (đầu vào/ra, kỹ năng, hiệu suất, thực hành tốt nhất). ¶• Cấp 4 – Công cụ/hoạt động cải tiến: kaizen, lean, TQM, six sigma, benchmarking. ¶Mẹo nhớ: Chiến lược → Phạm vi → Chiến lược vận hành → Cấu hình → Cải tiến.
      Cấp 1 – 6 quy trình :: Plan · Order · Source · Transform · Fulfill · Return ¶Mẹo nhớ: “Lập – Đặt – Nguồn – Chuyển – Giao – Trả”.
        Plan – Lập kế hoạch :: Cân bằng tổng thể cung & cầu để ra kế hoạch hành động. ¶• Lập kế hoạch nhu cầu: dự báo + kinh nghiệm để ước tính nhu cầu tại các điểm trong CCU. ¶• Lập kế hoạch cung ứng: đáp ứng tốt nhất yêu cầu từ kế hoạch nhu cầu. ¶• Lập kế hoạch tồn kho: số lượng & thời điểm tồn kho tối ưu theo doanh số và năng lực SX. ¶→ Tất cả thuộc quy trình S&OP. ¶Ví dụ cấp 2–3: P1 Plan Supply Chain (lập kế hoạch ở cấp vận hành, thường rà soát HẰNG THÁNG) gồm P1.1 Thu thập tín hiệu thị trường bên ngoài, P1.2 Tổng hợp yêu cầu CCU, P1.3 Đánh giá & tạo phản ứng cung, P1.4 Cân bằng tín hiệu thị trường & yêu cầu bằng mô hình hóa, P1.5 Lập lại – phân tích – chọn phản ứng tối ưu, P1.6 Truyền đạt kế hoạch sang thực thi. Mỗi bước có Metrics (VD P1.1 → RL.3.47 Forecast Accuracy), Practices (VD Demand Planning & Forecasting), People (kỹ năng: Forecasting, CRM, S&OP, ERP…). Các quy trình Plan khác: P2 Plan Order · P3 Plan Source · P4 Plan Transform · P5 Plan Fulfill · P6 Plan Return.
        Order – Đặt hàng :: Hoạt động khách hàng mua SP/DV: địa điểm, phương thức thanh toán, giá, trạng thái đơn… 3 cách xử lý đơn: ¶• Thủ công: giấy tờ, con người → chậm, lỗi, chi phí cao. ¶• Tự động: phần mềm quản lý đơn → giảm thao tác tay, giảm lỗi, nhanh hơn. ¶• Điện tử: tích hợp nền tảng tiếp nhận đơn, tồn kho, đóng gói, vận chuyển, CSKH; theo dõi tồn kho & trạng thái đơn.
        Source – Nguồn cung :: PROCUREMENT = SOURCING + PURCHASING. ¶• Sourcing (tìm nguồn cung): đánh giá & lựa chọn NCC/đối tác phù hợp có khả năng cung cấp hàng hóa/dịch vụ công ty cần. ¶• Purchasing (mua hàng): quy trình mua hàng hóa, dịch vụ từ NCC để đáp ứng nhu cầu công ty. ¶Hoạt động: chọn/phát triển NCC · đặt hàng · nhận hàng · kiểm tra · lập kế hoạch · xử lý thông tin. ¶Xem chi tiết C7.
        Transform – Chuyển đổi (Sản xuất) :: Biến hàng hóa thành thành phẩm để đáp ứng nhu cầu kế hoạch/thực tế: ¶• Mọi hoạt động từ NVL đến SP cuối + dòng vật liệu & thông tin SX. ¶• Tiêu chuẩn chất lượng & phương pháp kiểm soát cho từng quy trình. ¶• Cải tiến liên tục quy trình & theo sở thích KH. ¶Xem chi tiết C5.
        Fulfill – Thực hiện đơn hàng (Phân phối) :: Tập hợp hoạt động do nhiều đơn vị trong CCU thực hiện để di chuyển thành phẩm từ nhà SX đến KH, đáp ứng nhu cầu kế hoạch hoặc thực tế; gồm logistics nhập & xuất, và mạng thông tin giúp kênh cung ứng luôn cập nhật về sự kiện gián đoạn, tồn kho sẵn có, trạng thái giao hàng. ¶Quy trình chính: giao đúng số lượng – địa điểm – thời gian; quản lý yêu cầu KH; quản lý phương thức vận chuyển & đơn giao; chọn & quản lý nhà cung cấp dịch vụ logistics. ¶Thường gồm: quản lý đơn hàng, quản lý vận tải, quản lý phân phối.
        Return – Hoàn trả (Logistics ngược) :: Trả lại/nhận lại SP vì bất kỳ lý do nào: ¶• Vận chuyển vật lý hàng trả. ¶• Kiểm tra chất lượng, xác định lỗi. ¶• Ghi nhận vấn đề. ¶• Tháo rời, sửa chữa, tái chế hoặc tái nhập kho.
    C · Thách thức & Đánh đổi
      5 mục tiêu hiệu suất chung :: Độ tin cậy · Tốc độ · Chất lượng · Linh hoạt · Chi phí ¶(C5 bổ sung mục tiêu thứ 6 cho vận hành: Môi trường.) ¶Không thể tối đa tất cả cùng lúc → phải ĐÁNH ĐỔI.
      Mâu thuẫn trong hệ thống truyền thống :: Ma trận 3 phòng ban × 3 tiêu chí (mũi tên ↑ muốn tăng, ↓ muốn giảm): ¶• Marketing (mục tiêu: tăng doanh thu, hài lòng KH): Dịch vụ KH ↑ · Hiệu quả SX ↓ (chấp nhận lô nhỏ, nhiều mẫu) · Tồn kho ↑ ¶• Vận hành (giảm chi phí SX): Dịch vụ KH ↓ · Hiệu quả SX ↑ · Tồn kho ↑ (chạy lô dài) ¶• Tài chính (tăng lợi nhuận, dòng tiền, giảm đầu tư): Dịch vụ KH ↑ · Hiệu quả SX ↑ · Tồn kho ↓ ¶→ Không phòng nào đồng thuận cả 3 → cần S&OP và “một bộ số chung”.
      Quan điểm truyền thống – tối ưu cục bộ :: Nguyên liệu → Thu mua → Sản xuất → Phân phối → Khách hàng, mỗi khâu tối ưu riêng: ¶• Thu mua: giá mua thấp nhất, giữ hàng dự phòng. ¶• Sản xuất: tỷ lệ tận dụng cao, chạy dây chuyền dài (ít chuyển đổi), chi phí/đơn vị thấp, tồn an toàn. ¶• Phân phối: chất đầy xe tải, cước rẻ nhất, tồn kho an toàn. ¶→ Mỗi khâu đều thêm tồn kho “cho chắc” → tổng chuỗi tồn kho cao.
      5 thách thức quản lý CCU :: 1) Dịch vụ khách hàng – 6 ĐÚNG: sản phẩm, điều kiện, số lượng, địa điểm, thời gian, khách hàng. ¶2) Mạng lưới CCU – linh hoạt với thay đổi thị trường. ¶3) Lập kế hoạch & quản trị rủi ro – đánh giá và thiết kế lại định kỳ. ¶4) Thông tin minh bạch – hợp tác qua công nghệ. ¶5) Thu hút nhân tài – khó tìm người giỏi và đam mê.
      Hiệu ứng Bullwhip (roi da) :: ASCM: “Sự thay đổi LỚN ở upstream được tạo ra bởi một thay đổi NHỎ của nhu cầu ở downstream.” ¶Biến động khuếch đại dần từ khách hàng → bán lẻ → bán sỉ → nhà SX → NCC (“thay đổi nhỏ của nhu cầu thực gây ra vấn đề lớn”). ¶Ví dụ trên slide – giấy vệ sinh mùa COVID: KH mua tăng đột biến → nhà bán lẻ phải trữ thêm & đặt nhiều hơn → nhà SX đặt dư nguyên liệu → NCC dồn nguồn lực; trong khi vận tải, container, lao động thiếu hụt nên không kịp phản ứng. ¶(Kiến thức bổ sung, ngoài slide) Gốc rễ thường gặp: thiếu minh bạch thông tin, dự báo riêng lẻ ở từng tầng, đặt hàng theo lô, khuyến mãi. Giải pháp gắn với: chia sẻ dữ liệu POS (C2), dự báo hợp tác (C4), S&OP (C5).
  C2 · Phân tích dữ liệu CCU :: A – Cơ bản về phân tích dữ liệu; B – Phân tích dữ liệu CCU. ¶Kết chương: Dữ liệu ≠ Thông tin · Dữ liệu chính vs giao dịch · Các bước phân tích · Kỹ thuật phổ biến & báo cáo.
    A · Cơ bản về phân tích dữ liệu
      Định nghĩa dữ liệu :: Oxford: thực tế/thông tin được kiểm tra, sử dụng để tìm hiểu hoặc ra quyết định. ¶Merriam-Webster: thông tin thực tế (đo đạc, thống kê) làm nền cho suy luận, thảo luận, tính toán. ¶Dữ liệu có ở mọi lĩnh vực: địa lý, vận tải, văn hóa, khoa học, khí tượng, tài chính; dạng số liệu, thống kê, đồ thị, quan sát, đo lường.
      Dữ liệu vs Thông tin :: Dữ liệu: thực tế thô, chưa cấu trúc, đơn vị riêng lẻ không mang nghĩa, không phụ thuộc thông tin, KHÔNG đủ để ra quyết định. ¶Thông tin: dữ liệu đã xử lý, có cấu trúc, có ngữ cảnh, phụ thuộc vào dữ liệu, ĐỦ cơ sở ra quyết định. ¶Ví dụ: điểm từng học sinh = dữ liệu; điểm trung bình lớp = thông tin.
      Có cấu trúc vs Không cấu trúc :: Có cấu trúc: được xác định · định lượng · lưu trong kho dữ liệu (data warehouse) · dễ phân tích · định dạng cố định. ¶Không cấu trúc: chưa xác định · định tính · lưu trong hồ dữ liệu (data lake) · khó phân tích · nhiều định dạng.
      Data Analytics – Analysis – Analyst :: Data Analytics: khái niệm RỘNG, mọi hoạt động với dữ liệu (thu thập, phân tích, diễn giải) để người dùng dễ nắm ý nghĩa. ¶Data Analysis: MỘT THÀNH PHẦN của analytics – làm sạch, chuyển đổi, mô hình hóa, khai thác để trích thông tin hữu ích. ¶Data Analyst: người làm cả hai. ¶“Phân tích không phải công cụ hay công nghệ, mà là cách suy nghĩ và hành động dựa trên dữ liệu.”
      Khung CRISP-DM (6 giai đoạn) :: Cross-Industry Standard Process for Data Mining: mô hình chu kỳ 6 giai đoạn mô tả vòng đời khoa học dữ liệu, để lập kế hoạch – tổ chức – thực hiện dự án khai thác dữ liệu. Có thể quay vòng khi cần.
        1 · Hiểu vấn đề kinh doanh :: Xác định mục tiêu KD (bối cảnh, mục tiêu, tiêu chí thành công) · Đánh giá tình hình (định nghĩa, thuật ngữ, các bên liên quan) · Xác định mục tiêu khai thác dữ liệu & tiêu chí thành công · Lập kế hoạch dự án, đánh giá công cụ/kỹ thuật ban đầu.
        2 · Hiểu về dữ liệu :: Thu thập dữ liệu ban đầu · Mô tả dữ liệu · Khám phá dữ liệu · Đánh giá chất lượng dữ liệu (mỗi bước có báo cáo).
        3 · Chuẩn bị dữ liệu :: Mô tả tập dữ liệu · Lựa chọn (lập luận lấy/loại) · Làm sạch · Xây dựng cấu trúc (thuộc tính dẫn xuất, phiên bản lưu trữ).
        4 · Phân tích / Mô hình hóa :: Chọn kỹ thuật & giả định · Thiết kế thử nghiệm · Xây dựng mô hình (tham số, mô tả) · Đánh giá mô hình, điều chỉnh tham số.
        5 · Xác thực (Đánh giá) :: Đánh giá kết quả theo tiêu chí thành công của DN, phê duyệt mô hình · Rà soát quy trình · Xác định bước tiếp theo: danh sách hành động, ra quyết định.
        6 · Trình bày / Triển khai :: Kế hoạch triển khai · Kế hoạch giám sát & bảo trì · Báo cáo tổng kết & trình bày · Đánh giá sau dự án.
      Dữ liệu chính vs Dữ liệu giao dịch :: Dữ liệu chính (Master data): thông tin cơ bản, ổn định, làm tham chiếu – VD: khách hàng, nguyên vật liệu, nhân viên. ¶Dữ liệu giao dịch (Transactional): ghi lại sự kiện kinh doanh thực tế, có vòng đời – VD: mua, bán, chi phí bảo hiểm. ¶So sánh (Chính | Giao dịch): ¶• Ổn định: tương đối ổn định | thay đổi liên tục ¶• Độc đáo: đại lượng duy nhất | theo từng sự kiện ¶• Nhất quán: đồng nhất giữa hệ thống | chi tiết từng sự kiện ¶• Hiện diện: dùng cho nhiều bộ phận | chủ yếu vận hành ¶• Tích hợp: vào nhiều hệ thống | hỗ trợ hoạt động hằng ngày ¶• Thời gian giá trị: dài hạn | tạm thời
    B · Phân tích dữ liệu trong CCU
      5 nguồn dữ liệu CCU :: 1) POS: tín hiệu nhu cầu thực kèm giá bán; tồn kho do NCC quản lý (VMI). ¶2) RFID: tồn kho thực, tín hiệu tự động thực hiện đơn, tự động ghi nhận, tự động thanh toán. ¶3) Nhà cung cấp: quản lý rủi ro NCC, phối hợp quy trình. ¶4) Cảm biến sản xuất: giám sát thiết bị thời gian thực, phát hiện xuống cấp. ¶5) GPS: vị trí tồn kho thời gian thực, thời gian chờ xử lý, lead time giao hàng.
      4 loại phân tích :: Giá trị và độ phức tạp tăng dần: Mô tả → Đánh giá (chẩn đoán) → Dự báo → Đề xuất.
        Phân tích mô tả :: “Điều gì ĐÃ xảy ra?” – thống kê quá khứ, đánh giá hiệu suất bằng đồ thị, biểu đồ, báo cáo.
        Phân tích đánh giá (chẩn đoán) :: “TẠI SAO lại xảy ra?” – phân tích nguyên nhân gốc rễ; khám phá dữ liệu, khai thác dữ liệu, phân tích chi tiết (drill-down).
        Phân tích dự báo :: “Điều gì SẼ xảy ra?” – dữ liệu lịch sử đưa vào mô hình máy học tìm xu hướng, áp lên dữ liệu hiện tại để dự đoán.
        Phân tích đề xuất :: “Chúng ta NÊN làm gì?” – đề xuất hành động dựa trên dự đoán, phác thảo tác động của từng phương án.
        {vd} Ví dụ bánh cookie 10 ngày :: Áp CRISP-DM: sau ngày hội 1 ngày, nhóm được mời tham gia sự kiện 10 ngày → cần DỰ BÁO NHU CẦU. ¶• Hiểu vấn đề KD: khởi nghiệp, hệ thống thủ công (lỗi con người), cần dữ liệu nhu cầu. ¶• Hiểu dữ liệu: xác định/chưa xác định? định dạng cố định/đa dạng? định lượng/định tính? → Có dữ liệu gì, cấu trúc ra sao, ai nắm giữ? ¶• Chuẩn bị dữ liệu: chọn & làm sạch dữ liệu bán hàng, khách hàng. (Mô hình hóa, đánh giá, triển khai → các module sau.) ¶Dữ liệu chính: SKU (mã, tên, nhóm), khách hàng, NCC (mã, tên, địa chỉ). Dữ liệu giao dịch: giao dịch bán (KH, số lượng, thời gian), giao hàng NCC. ¶• Mô tả: hợp dân văn phòng; cao điểm 10:00 & 15:00. ¶• Đánh giá: bánh hữu cơ, ít đường → bữa nhẹ lành mạnh; 10h & 15h là giờ ăn nhẹ. ¶• Dự báo: địa điểm gần tòa văn phòng → doanh số ngày ít nhất gấp đôi. ¶• Đề xuất: thuê nhân viên tạm thời cho giờ cao điểm, giải quyết nhu cầu tăng và năng lực hạn chế.
      Kỹ thuật thống kê phổ biến
        {f} Mean · Median · Mode · Range :: Mean (trung bình) = tổng / số phần tử. VD 3,2,10,5 → 20/4 = 5. ¶Median (trung vị) = giá trị giữa sau khi sắp xếp. VD 1,3,6,8,9 → 6; dãy chẵn 1,4,5,6,8,9 → (5+6)/2 = 5,5. ¶Mode (yếu vị) = giá trị xuất hiện nhiều nhất. VD 2,4,4,5,6 → 4. ¶Range (khoảng) = lớn nhất − nhỏ nhất. VD 1,1,3,5,6 → 5.
        {!} Lưu ý lỗi slide trung vị :: Slide ghi “Median = (5+6)/1 = 5.5” – đúng phải là (5+6)/2 = 5,5.
        {f} Trung bình di động :: VD (3+5+7)/3 = 5. Điểm mạnh: phổ biến nhất, dễ dùng. Hạn chế: bỏ qua biến động phân phối.
        Phân phối chuẩn :: Phân phối xác suất đối xứng, hình chuông (Gaussian/bell curve); phần lớn điểm dữ liệu tập trung quanh trung bình; mean = median = mode ở trung tâm. Ngoài ra có phân phối lệch phải và lệch trái. Đo độ phân tán bằng MAD và SD.
        {f} MAD – Độ lệch tuyệt đối trung bình :: Mục đích: đo mức dao động của dữ liệu. ¶MAD = Σ|xᵢ − x̄| / n ¶VD 10,15,15,17,18,21: mean = 16; độ lệch 6,1,1,1,2,5 → tổng 16 → MAD = 16/6 ≈ 2,67.
        {f} SD – Độ lệch chuẩn :: Mục đích: đo mức phân tán quanh trung bình. ¶SD = √( Σ(x − μ)² / N ) ¶VD 6,2,3,1: μ = 3; bình phương lệch 9,1,0,4 = 14; 14/4 = 3,5; √3,5 ≈ 1,87.
      Biểu đồ & Dashboard :: Mẫu biểu đồ hay dùng: thác nước (waterfall) báo cáo lãi lỗ; cột vòng quay tồn kho so với mục tiêu; đường % hàng hết (OOS) so với mục tiêu; bong bóng (bubble) rủi ro – trục X: khả năng quản lý rủi ro, trục Y: khả năng phát hiện rủi ro, kích thước bong bóng = giá trị tác động rủi ro. ¶Dashboard cho MỌI bên liên quan đọc: đơn giản, nhiều thông tin, dễ dùng.
  C3 · Bán lẻ :: A – Tổng quan bán lẻ; B – Vận hành bán lẻ; C – CCU trong bán lẻ. ¶Kết chương: các loại hình bán lẻ · vai trò CCU trong bán lẻ · phân biệt truyền thống vs TMĐT · trọng tâm CCU từng loại hình.
    A · Tổng quan về Bán lẻ
      Hiểu khách hàng :: CCU KẾT THÚC ở người tiêu dùng → được xây dựng để tạo và gia tăng giá trị cho họ. 3 câu hỏi: Bạn bán cho ai? Họ cần gì? Hành vi của họ thế nào?
      Định nghĩa :: Retailing (Fernie, 2018): hoạt động DN nhằm tăng giá trị SP/DV bằng cách bán cho người tiêu dùng cuối cho mục đích cá nhân/gia đình. ¶Retailer (APICS): DN lấy SP và bán lại cho người tiêu dùng cuối.
      Các loại hình cửa hàng bán lẻ :: Cửa hàng tiện lợi · Chuỗi cửa hàng · Nhượng quyền · Cửa hàng chuyên doanh · Cửa hàng bách hóa · Siêu thị · Đại siêu thị · Trung tâm thương mại · Factory outlet.
      Thương mại truyền thống (GT) :: Mật độ cửa hàng rất cao nhưng quy mô nhỏ; xe giao nhiều điểm dừng/km (hoặc phục vụ nhiều cửa hàng từ một điểm dừng); kệ hạn chế, đơn hàng nhỏ → doanh thu/điểm dừng thấp, cần giao hàng hiệu quả (Route to Market). VD: tạp hóa, chợ tươi sống, cửa hàng chuyên dụng.
      Thương mại hiện đại (MT) :: Cửa hàng quy mô lớn, có tổ chức; nhiều thương hiệu/danh mục tại một nơi; KH tiếp cận cả hàng phổ thông lẫn hàng chuyên biệt (niche); tận dụng lợi thế quy mô để đàm phán với NCC; cần kế hoạch chiến lược. VD: siêu thị, đại siêu thị, cửa hàng lớn.
      Bán lẻ truyền thống vs TMĐT :: (Truyền thống | TMĐT) ¶• Vị trí tồn kho: kho tập trung, DC vùng, cửa hàng | nhiều fulfillment center, kho vùng, giao thẳng từ NSX ¶• Quản lý tồn kho: bổ sung định kỳ theo dự báo (EOQ, ROP) | theo dõi thời gian thực, bổ sung theo nhu cầu thực ¶• Mô hình phân phối: tập trung | phi tập trung, nhiều nút gần KH ¶• Vận chuyển: full pallet/full case đến cửa hàng | kiện lẻ giao thẳng KH ¶• Tương tác KH: trực tiếp | rộng qua kênh online ¶• Hàng trả: tại cửa hàng | trung tâm trả hàng tập trung, thường miễn phí ¶• Linh hoạt: thấp | cao, dễ mở rộng ¶• Chặng cuối: không trọng tâm | trọng tâm chiến lược
      Top 10 nhà bán lẻ Việt Nam :: Top 10 công ty bán lẻ uy tín 2023 (Vietnam Report), 2 nhóm ngành: ¶• Siêu thị, tổng hợp: Central Retail Việt Nam · Saigon Co.op · WinCommerce (WinMart) · MM Mega Market · AEON Việt Nam · SATRA · Lotte Mart · SASCO · BRG Mart · FamilyMart. ¶• Điện máy, điện thoại, thiết bị số, sách: Thế Giới Di Động · FPT Retail · Viettel Store · Cao Phong (Điện máy Chợ Lớn) · Thế Giới Số (Digiworld) · MediaMart · Di Động Thông Minh · FAHASA · Hoàng Hà Mobile · VHC.
      4 đặc điểm ngành bán lẻ :: Tính sẵn có (đủ hàng) · Tính đa dạng (nhiều loại, giá, thương hiệu) · Tính tùy chỉnh (cá nhân hóa dịch vụ) · Thâm nhập thị trường (giới thiệu SP mới, hướng dẫn sử dụng).
    B · Vận hành trong bán lẻ
      Merchandising & Merchants :: Merchandising: thực tiễn trưng bày và bán SP, tại cửa hàng hay online, để tác động ý định mua (Reflektion 2018). ¶Merchants: người mua hàng để bán lại (APICS). ¶5 nguyên tắc của Merchants: (1) Cung cấp thứ KH muốn · (2) Chuẩn bị kế hoạch hàng hóa (merchandise plan) · (3) Lựa chọn nguồn cung · (4) Nhất quán & thay đổi · (5) Trưng bày ĐÚNG DANH MỤC (Present Right Assortment).
        {!} Lưu ý dịch slide Merchants :: Bản tiếng Việt ghi nguyên tắc 5 là “Các dòng sản phẩm hiện tại” – bản gốc là “Present Right Assortment” = trưng bày/cung cấp đúng danh mục sản phẩm (nối với mục Assortment ngay sau).
      Assortment – Danh mục sản phẩm :: Chiến lược xác định nhóm SP tối ưu cho tồn kho; KH quyết định mua dựa trên thứ họ thấy. ¶• Chiều RỘNG: số dòng sản phẩm. ¶• Chiều SÂU: số biến thể mỗi dòng (màu, size, mẫu).
      Mức độ thâm nhập :: Bản gốc: thước đo SP/DV được KH sử dụng nhiều đến đâu so với tổng thị trường ước tính của SP/DV đó. Bản Việt: % SP/DV của công ty so với tổng doanh thu ngành hoặc tổng người tiêu dùng mục tiêu. Trong bán lẻ đo trên giỏ hàng/danh mục đơn hàng.
    C · CCU trong hoạt động bán lẻ
      Mục tiêu CCU bán lẻ :: Mang lại trải nghiệm mua sắm THUẬN LỢI NHẤT cho người tiêu dùng cuối. Các CCU khác có thể tập trung SX số lượng lớn, B2B, chuẩn hóa logistics; còn bán lẻ thì sự hài lòng người mua là TRUNG TÂM.
      Mô hình quản lý CCU bán lẻ :: Nhà bán lẻ → Dự báo & lập kế hoạch → Thiết kế & phát triển SP → Tìm nguồn & quản lý đơn hàng → Khách hàng. Xuyên suốt: Quản lý quan hệ nhà cung cấp (SRM) và Phân phối & Logistics.
      4 nhân tố chính RSC :: Nhà sản xuất (biến NVL thành TP) → Nhà bán buôn (mua lượng lớn giá thấp, bán cho bán lẻ) → Nhà bán lẻ (mua từ bán buôn/NSX, bán lượng nhỏ) → Người tiêu dùng (điểm kết thúc).
      Logistics MT vs Truyền thống :: (MT | Truyền thống) ¶• Quy mô: khối lượng lớn, mạng phức tạp, hiệu quả | lô nhỏ, ít tự động ¶• Công nghệ: WMS, TMS, phân tích dữ liệu | giấy tờ ¶• Dự báo: phức tạp, JIT | kinh nghiệm, dễ hết hàng/dư ¶• Hợp tác: mạnh (bán lẻ, NPP, 3PL) | quan hệ cá nhân ¶• Giao hàng: đa dạng (click & collect, tận nhà) | chủ yếu giao cho cửa hàng/kho ¶• Minh bạch: theo dõi thời gian thực | hạn chế
      Trọng tâm theo loại hình :: Truyền thống: giảm chi phí · cải thiện hiệu quả & tốc độ · gia tăng lợi thế cạnh tranh. ¶TMĐT: chiến lược CCU · chiến lược & quản lý kho · nền tảng & công nghệ · hỗ trợ khách hàng · logistics & đối tác dịch vụ logistics.
  C4 · Nhu cầu & Dự báo :: A – Kênh phân phối; B – Nhu cầu; C – Dự báo nhu cầu. ¶Kết chương: các kênh phân phối · nhu cầu & đặc điểm · quản lý nhu cầu & quy trình dự báo · kỹ thuật dự báo & KPI. Đây là chương nặng tính toán nhất cùng C5, C6.
    A · Kênh phân phối
      3 loại kênh theo chức năng :: • Kênh bán hàng: thúc đẩy người mua, chia sẻ thông tin, đàm phán, thực hiện giao dịch tài chính. ¶• Kênh giao hàng: chỉ phần phân phối vật lý. ¶• Kênh dịch vụ: dịch vụ sau bán.
      GT – Thương mại truyền thống :: Mạng phân phối trải rộng: nhà bán lẻ nhỏ, đại lý, nhà phân phối, bán buôn, NCC.
      MT – Thương mại hiện đại :: Tiếp cận có kế hoạch, tổ chức tốt trong phân phối & logistics; dễ dàng, nhanh, tiện lợi.
      TMĐT :: Nền tảng trực tuyến bán thẳng cho người tiêu dùng: website, sàn (Amazon), cửa hàng mạng xã hội.
      OTC – Không kê đơn :: Bán SP trực tiếp không cần toa thuốc, qua nhà thuốc, cửa hàng, online.
      HORECA / B2B :: Khách sạn – Nhà hàng – Ăn uống (Canteen). Slide định nghĩa theo B2B: bán giữa doanh nghiệp qua bán buôn, NPP, đội bán hàng trực tiếp, web B2B.
      Kênh tại Việt Nam :: Nhà SX/NPP → ¶• GT: chợ truyền thống, tạp hóa (M&P), kiot… ¶• MT: siêu thị, đại siêu thị, cửa hàng thực phẩm, cửa hàng tiện lợi… ¶• Kênh mở rộng: TMĐT, Horeca, B2B.
      Vì sao quản lý theo kênh? :: Hiểu nhu cầu người mua · chiến lược kinh doanh phù hợp, hiệu quả · mức đầu tư hợp lý vào thương hiệu · tối đa hóa nguồn lực sẵn có.
    B · Nhu cầu
      Định nghĩa & nguồn nhu cầu :: Nhu cầu = sự cần thiết/mong muốn với SP/DV. ¶Nguồn: dự báo · đơn KH · đơn bổ sung từ DC · chuyển giao giữa nhà máy · khác (hàng mẫu, quà tặng, quyên góp). ¶Câu hỏi: nhu cầu có luôn tạo doanh số? → KHÔNG, chỉ khi có hàng/năng lực đáp ứng. Biểu đồ: đơn hàng “tiêu thụ” dự báo theo thời gian, giới hạn bởi công suất.
      4 mô hình nhu cầu :: • Xu hướng: tăng, giảm, đi ngang. ¶• Mùa vụ: biến động đều đặn theo kỳ (VD theo quý qua 3 năm). ¶• Ngẫu nhiên: do sự kiện bất ngờ, hành vi con người. ¶• Chu kỳ: dạng sóng dài hạn (chu kỳ kinh tế).
      Nhu cầu & vòng đời sản phẩm :: R&D/ra mắt → Tăng trưởng → Trưởng thành → Suy thoái. ¶Tác động nhu cầu bằng khuyến mãi (tăng tạm thời): quảng cáo, hàng mẫu, quà tặng, khuyến mãi thương mại, MOQ, giảm giá mua số lượng lớn. Mùa vụ = đỉnh lặp lại.
      Độc lập vs Phụ thuộc :: Ví dụ mũi tên: MŨI TÊN = nhu cầu độc lập; lông vũ, cán, đầu = nhu cầu phụ thuộc. ¶• Chỉ DỰ BÁO nhu cầu độc lập. ¶• Nhu cầu phụ thuộc được TÍNH TOÁN (qua BOM/MRP – xem C5).
      Ổn định vs Biến động :: Ổn định: giữ hình dạng chung, trung bình cho dự báo dùng được, dao động trong UCL–LCL. ¶Biến động (dynamic): thất thường, khó dự báo.
      Khung quản lý nhu cầu :: Quản lý nhu cầu vừa là quy trình độc lập vừa tích hợp vào S&OP/IBP. Chuỗi: Kế hoạch KD (chiến lược) → S&OP (chiến thuật) → MPS, RCCP → MRP, CRP, FAS → PAC, MES (thực thi); nối với tài chính (sổ cái, phải thu, phải trả, ngân sách, ABC costing), CSDL (BOM, routing, tồn kho, đơn mở), mua hàng, kho, EDI, đo lường hiệu suất.
      3 quy trình liên quan :: Quản lý Marketing → Marketing mix 4P ¶Quản lý quan hệ KH (CRM) → Tiếng nói khách hàng (VoC) ¶Lập kế hoạch nhu cầu → Dự báo
    C · Dự báo nhu cầu
      Định nghĩa & tầm hoạch định :: Dự báo nhu cầu = ước tính nhu cầu SP/DV theo số lượng & giá trị. ¶• Kế hoạch KD (SP mới, thị trường mới, sáng kiến CCU): CY → CY+5. ¶• S&OP (kế hoạch bán hàng, thu mua/SX, tài chính): CY → CY+3. ¶• Dự báo nhu cầu (sản lượng & giá trị): 3–18 tháng – sản xuất gì, khi nào? ¶• Lịch trình SX tổng hợp (MPS): 1–3 tháng – giao gì, từ đâu đến đâu, khi nào?
      4 nguyên tắc dự báo :: 1) Hiếm khi chính xác 100%. ¶2) Nên kèm ước tính sai số. ¶3) Chính xác hơn với NHÓM/dòng SP (gộp). ¶4) Chính xác hơn với khoảng thời gian GẦN.
      Cách tiếp cận :: 1) Dự báo ở cấp nào? Sản phẩm (SKU, nhóm, dòng, thương hiệu) · Địa điểm (Bắc/Trung/Nam, toàn quốc) · Kênh (GT, MT, TMĐT). ¶2) Cách nào? Dự báo hình kim tự tháp 3 tầng: dự báo kinh doanh (tổng) → dự báo dòng SP → dự báo từng SP (tiền & đơn vị). ¶• TỪ TRÊN XUỐNG: lập tổng trước rồi phân bổ xuống. VD slide: tổng $1.400 → dòng A $800, B $600 → A1 $400, A2 $400, B1 $400, B2 $200. ¶• TỪ DƯỚI LÊN: dự báo từng SP rồi cộng dồn lên. VD slide: A1 $500 + A2 $200 = A $700; B1 $600 + B2 $50 = B $650 → tổng $1.350. ¶(Đơn giá A1 $10, A2 $20, B1 $20, B2 $10 dùng để đổi tiền ↔ đơn vị.)
      Kỹ thuật định tính :: Dựa trên trực giác, ý kiến có căn cứ; chủ quan. Dùng cho SP MỚI và dự báo DÀI HẠN. ¶Ưu: dự báo được khi không có dữ liệu định lượng hoặc biến động quá lớn; lập nhanh, không cần tính toán phức tạp. ¶Nhược: thiếu bằng chứng · quá tự tin · cá nhân tuân theo tập thể (group-think) · chi phí cao khi vi tính hóa.
        Quy trình chung lập dự báo định tính :: Mục tiêu dự báo → kết hợp (1) dữ liệu chuỗi thời gian & dữ liệu liên kết qua PHÂN TÍCH ĐỊNH LƯỢNG và (2) dữ liệu hành vi qua ĐÁNH GIÁ ĐỊNH TÍNH → Dự báo định tính. ¶Dữ liệu định lượng dùng làm nền: khảo sát, nhóm tập trung, panel, thử nghiệm thị trường · phương pháp khảo sát chuẩn · mô hình thống kê hành vi tiêu dùng (nhân khẩu học ↔ mua hàng) · đánh giá chủ quan dựa trên kinh nghiệm · trực giác thực tiễn.
        Nhận định cá nhân :: Phổ biến nhất; rẻ, nhanh; kết quả rất khác nhau.
        Ước lượng từ đội bán hàng :: Dùng dự báo doanh số của sales; tận dụng người gần thị trường & KH nhất.
        Đồng thuận nhóm :: Chuyên gia khắp CCU cùng xem xét; nhanh, ít cần dữ liệu thống kê, gộp kinh nghiệm tập thể.
        Nghiên cứu thị trường :: Khảo sát phân khúc; tốn kém, mất thời gian, phụ thuộc tính ngẫu nhiên của mẫu.
        Phương pháp Delphi :: Chuyên gia KHÔNG gặp mặt, trả lời chuỗi bảng hỏi; phản hồi chia sẻ cho cả nhóm đánh giá, xếp hạng; thu hẹp ý kiến.
        Dự báo tầm nhìn :: Đột phá nhất; tiên đoán dựa trên trực giác, so sánh lịch sử; phi khoa học, phi định lượng.
      Kỹ thuật định lượng :: • NGOẠI TẠI (extrinsic): dựa trên quan hệ nhân quả, yếu tố bên ngoài – dự báo tổng nhu cầu công ty, dòng/nhóm SP. ¶• NỘI TẠI (intrinsic): giả định mẫu hình quá khứ dự đoán tương lai (chuỗi thời gian) – dự báo 1 SP cụ thể có dữ liệu lịch sử dài.
        {f} Dự báo đơn giản (Naive) :: Fₜ₊₁ = Xₜ ¶Kỳ sau = thực tế kỳ này. Dạng định lượng đơn giản nhất; dùng khi không thể dự đoán các điểm đảo chiều (turning points) báo hiệu sai số.
        {f} Trung bình động :: Fₜ₊₁ = (Xₜ + Xₜ₋₁) / 2 (ví dụ 2 kỳ; tổng quát: trung bình n kỳ gần nhất).
        {f} Trung bình lũy kế (YTD) :: Fₜ₊₁ = (Xₜ + Xₜ₋₁ + … + Xₜ₋ₙ) / n ¶Cộng dồn thực tế từng kỳ từ đầu năm rồi chia cho SỐ KỲ đã cộng; kết quả là dự báo kỳ tới. ¶Ký hiệu: Fₜ₊₁ dự báo kỳ t+1 · t kỳ hiện tại · Xₜ thực tế gần nhất · n số kỳ.
        {f} Trung bình có trọng số :: Fₜ₊₁ = Σ(w·X) / Σw = (w₁Xₜ + w₂Xₜ₋₁ + w₃Xₜ₋₂) / Σw ¶Gán trọng số lớn hơn cho dữ liệu gần → sát thực tế hơn.
        {f} Làm mịn lũy thừa :: Fₜ = α·Dₜ₋₁ + (1 − α)·Fₜ₋₁ ¶α (hằng số làm mịn) = 2 / (n + 1), n = số kỳ dùng trong tính toán – chọn đúng α là mấu chốt. ¶D = nhu cầu thực tế; F = dự báo. Ưu điểm: gán trọng số cho dữ liệu quá khứ & hiện tại để phản ánh thay đổi mẫu hình nhu cầu. ¶(Bổ sung) α lớn → phản ứng nhanh với thay đổi; α nhỏ → mượt hơn.
          {vd} Bài tập làm mịn lũy thừa :: (Ví dụ tự luyện, không có trên slide) n = 3 → α = 2/4 = 0,5. Dự báo kỳ trước F = 100, thực tế D = 120 → F mới = 0,5×120 + 0,5×100 = 110.
        {f} Dự báo theo mùa vụ (3 bước) :: Dùng khi nhu cầu có tính mùa vụ, tiếp cận top-down, biết rõ tổng nhu cầu năm. ¶B1: Chỉ số mùa vụ = nhu cầu TB của kỳ / nhu cầu TB mọi kỳ. ¶B2: Nhu cầu khử mùa vụ = dự báo năm / số kỳ. ¶B3: Dự báo kỳ = chỉ số mùa vụ × nhu cầu khử mùa vụ.
          {vd} Bài tập mùa vụ :: Lịch sử 3 năm theo quý: Q1 122/130/132 · Q2 108/100/98 · Q3 81/73/71 · Q4 90/96/99. ¶B1: TB Q1 = 128; Q2 = 102; Q3 = 75; Q4 = 95; TB chung = 400/4 = 100 → chỉ số 1,28 / 1,02 / 0,75 / 0,95. ¶B2: dự báo năm 4 = 420 → 420/4 = 105/quý. ¶B3: Q1 = 1,28×105 ≈ 134; Q2 ≈ 107; Q3 ≈ 79; Q4 ≈ 100.
          {!} Lưu ý lỗi slide mùa vụ :: Slide ghi “Q3 = (81+74+71)/3” – số liệu bảng là 73 (kết quả 75 vẫn đúng); và “(128+102+85+95)/4” – đúng phải là 75 thay cho 85 (tổng 400, TB 100).
      Theo dõi dự báo :: Vì sao? Hiểu tại sao nhu cầu khác dự báo · lên kế hoạch cho sai số tương lai (cải thiện quy trình) · cải thiện phương pháp/mô hình. ¶Hai chiều đánh giá: Chính xác/Không chính xác và Thiên lệch/Không thiên lệch.
      KPI dự báo
        {f} BIAS – độ thiên lệch :: BIAS = (Thực tế − Dự báo) / Thực tế — xu hướng/hướng của sai số. ¶• BIAS DƯƠNG = dự báo THẤP hơn thực tế (under-forecast) → thiếu tồn kho → chi phí mất doanh số, cung ứng gấp. ¶• BIAS ÂM = dự báo CAO hơn thực tế (over-forecast) → thừa tồn kho → chi phí lưu kho, hấp thụ, tài chính, lỗi thời.
        {f} MAPE :: MAPE = Σ|Thực tế − Dự báo| / ΣThực tế — độ LỚN sai số, không cho biết hướng. ¶Biến động càng cao càng khó dự báo. MAPE ảnh hưởng trực tiếp tồn kho an toàn: sai số cao → SS cao → chi phí lưu kho, tài chính, lỗi thời. ¶Quy tắc: 1% MAPE ≈ 2 ngày tồn kho (DOS). ¶SS = Z × √LT × 1,25 × MAPE (đơn vị); 1,25 = hệ số đổi MAPE sang RMSE; Z(96%) = 1,75; LT 1 tháng = 1. ¶(DOS = Days of Supply – số ngày tồn kho.)
          {vd} Bài tập tồn kho an toàn từ MAPE :: (Ví dụ tự luyện, không có trên slide) Nhu cầu tháng 1.000 đv, MAPE 10% → sai số 100 đv; mức dịch vụ 96% → Z = 1,75; LT = 1 tháng → √1 = 1. ¶SS = 1,75 × 1 × 1,25 × 100 ≈ 219 đv. ¶Nếu LT = 4 tháng → √4 = 2 → SS ≈ 438 đv (LT dài gấp 4, SS chỉ gấp 2).
        {vd} Bảng ví dụ BIAS & MAPE :: A: thực tế 100, dự báo 90 → sai số 10; BIAS 10%; MAPE 10%. ¶B: 90 vs 100 → −10; BIAS −11,1%; MAPE 11,1%. ¶C: 80 vs 60 → 20; BIAS 25%; MAPE 25%. ¶Tổng: 270 vs 250 → BIAS = 20/270 = 7,4%; MAPE = 40/270 = 14,8%. ¶Bài học: sai số trái dấu triệt tiêu trong BIAS nhưng KHÔNG triệt tiêu trong MAPE.
      Phân loại ABC (theo giá trị) :: A: 2–25% số mặt hàng, 40–80% giá trị – đặc biệt quan trọng. ¶B: 20–40% mặt hàng, 15–40% giá trị – trung bình. ¶C: 40–75% mặt hàng, 5–20% giá trị – tối thiểu. ¶Ứng dụng: mua hàng (đầu tư quan hệ NCC hàng A) · logistics (bảo vệ hàng A) · lập kế hoạch (dự báo khắt khe hàng A) · tài chính (ưu tiên kiểm kê chu kỳ).
      Phân loại XYZ (khả năng dự báo) :: Hệ số biến thiên CoV = σ / D (độ lệch chuẩn / nhu cầu trung bình). ¶Mục đích: xác định khả năng dự báo của nhu cầu/tiêu thụ (thường cho thành phẩm). ¶• X – ổn định (Steady): CoV ≤ 20%; nhóm DỄ dự báo nhất; nhu cầu thường xuyên, rất ít biến động, vòng quay đều → dự báo tin cậy. ¶• Y – không đều (Irregular): 20% < CoV ≤ 60%; biến động mạnh nhưng do YẾU TỐ ĐÃ BIẾT → dự báo được phần nào. ¶• Z – thất thường (Erratic/Lumpy): CoV > 60%; nhóm KHÓ dự báo nhất; nhu cầu không đều, rời rạc, không có xu hướng hay nguyên nhân dự đoán được → gần như không thể dự báo tin cậy.
      Ma trận ABC – XYZ :: XYZ bổ sung cho ABC một lớp thống kê (độ lệch chuẩn mức sử dụng). 9 ô: trục dọc giá trị/sản lượng (A cao → C thấp) × trục ngang độ bất định/biến động (X → Z); khả năng dự báo GIẢM dần từ X sang Z. ¶Theo bảng trên slide: ¶• Hàng A (giá trị cao, sản lượng lớn): “Reliable forecast”. ¶• Hàng B (trung bình): “Less reliable forecast”. ¶• Hàng C (thấp): “Impossible to forecast”. ¶• Cột X: ổn định, nhu cầu đều · Y: dao động · Z: rất dao động, nhu cầu bất thường. ¶AX: tốt nhất (giá trị cao, ổn định). CZ: tệ nhất (giá trị thấp, rất biến động).
      Dự báo tinh gọn (Lean Forecasting) :: Đánh giá hồ sơ nhu cầu & thị trường, khả năng dự báo của danh mục và giá trị gia tăng của dự báo (FVA – Forecast Value Add) qua phân khúc ABC-XYZ để chọn chiến lược lập kế hoạch nhu cầu phù hợp nhất. Ma trận 2×2: trục dọc Tầm quan trọng (ABC), trục ngang Biến động nhu cầu (XYZ). ¶• “Automate X” – cả cột X (A-X và BC-X) → TỰ ĐỘNG HÓA dự báo bằng thống kê. ¶• “Focus A” – hàng A là nơi dồn công sức. ¶• A-YZ → DEEP DIVE (đào sâu): chuyên gia phân tích để tìm ra MẪU HÌNH NHU CẦU (mũi tên “Demand Pattern”), đưa mã hàng về dạng X. ¶• BC-YZ → RATIONALIZE (tinh giản): giảm/hợp lý hóa danh mục, không đầu tư công sức dự báo. ¶Cân bằng: chi phí sai số dự báo vs chi phí cải thiện dự báo.
  C5 · Vận hành & Sản xuất :: A – Tổng quan & môi trường sản xuất; B – Lập kế hoạch & kiểm soát sản xuất (MPC). ¶Kết chương: bức tranh tổng thể quản lý vận hành · môi trường sản xuất · các tầng hoạch định & kiểm soát · khu vực chức năng & năng lực.
    A · Tổng quan & Môi trường sản xuất
      Định nghĩa :: Bộ phận vận hành: chịu trách nhiệm hoạt động sản xuất SP/DV; mọi DN đều có, tên gọi khác nhau. ¶Quản lý vận hành: quản lý nguồn lực để SX SP/DV. ¶Nhà quản lý vận hành: người chịu trách nhiệm một phần/toàn bộ nguồn lực vận hành. (Slack, Chambers, Johnston – Operations Management, 6th Ed.)
        {!} Lưu ý lỗi slide định nghĩa :: Trang “Definition and Comparison” (C5 tr.5–6) còn sót 2 ô chữ của C2 (“Data analysis is a component of data analytics…”, “A person who conduct the analytics…”) nằm cạnh mục Quản lý vận hành / Nhà quản lý vận hành. Hãy bỏ qua 2 ô này, chỉ học định nghĩa của Slack et al. ở trên.
      Mô hình Input – Transform – Output :: Nguồn lực (kinh nghiệm, con người, kiến thức, đối tác) → Phù hợp (hiệu quả, sáng tạo, hiệu suất cao) → Tạo ra (sản xuất, thay đổi, bán, di chuyển, sửa chữa, định hình) → Kết quả (SP, DV, ý tưởng) → Thị trường (xã hội, người dùng, KH) → Nhu cầu (ước mơ, nhu cầu, mối quan tâm).
      Các hoạt động trong vận hành :: Trong tổ chức (cùng R&D, Marketing, Tài chính): Quản lý sản xuất · Quy trình sản xuất · Kiểm soát sản xuất (lịch máy, vật tư, nhân lực) · Kiểm soát chất lượng (NVL & TP) · EHS (Môi trường, Sức khỏe, An toàn).
      Mục tiêu của vận hành :: Chất lượng · Độ tin cậy · Tốc độ (phản hồi nhanh) · Linh hoạt · Chi phí + mục tiêu MỚI: MÔI TRƯỜNG.
      4 môi trường sản xuất :: Khác nhau ở “điểm tách đơn hàng” – bắt đầu từ đâu khi có đơn → quyết định lead time giao hàng.
        ETO – Thiết kế theo đơn :: Thiết kế → mua NVL → SX → lắp ráp → giao. Lead time DÀI nhất. Hạng mục chuyên môn cao, giá trị cao: công trình, cầu, nội thất tùy chỉnh. Nhiệm vụ: cung cấp khả năng kỹ thuật, điều chỉnh công suất theo nhu cầu KH.
        MTO – Sản xuất theo đơn :: Tồn NVL → SX → lắp ráp → giao. KH sẵn sàng chờ SP độc nhất, tùy chỉnh. Hàng giá trị cao, SX lâu hoặc dễ lỗi thời: máy móc, thiết bị. Nhiệm vụ: xác định ngày giao, đáp ứng ngày cam kết.
        ATO – Lắp ráp theo đơn :: SX bán thành phẩm → tồn BTP → lắp ráp khi có đơn → giao. Tối ưu chi phí tồn kho. VD: máy tính, ô tô, đồ nội thất. Nhiệm vụ: xác định & đáp ứng ngày giao.
        MTS – Sản xuất để tồn kho :: SX BTP → lắp ráp → tồn TP → giao. Lead time NGẮN nhất. Hàng được dự trữ sẵn cho dịp đặc biệt, nhu cầu tăng đột ngột hoặc hàng tiêu dùng nhanh. Hàng thiết yếu giá rẻ: kem đánh răng, dầu gội, sữa tắm, đồ uống đóng chai. Nhiệm vụ: đảm bảo mức tồn TP và mức dịch vụ KH.
      Yếu tố quyết định môi trường SX :: Kỳ vọng thời gian giao hàng · Mức độ KH tham gia thiết kế · Sản lượng & độ đa dạng SP · Vòng đời SP. ¶Ma trận sản lượng – đa dạng: ETO (đa dạng cao, sản lượng thấp) → MTO → ATO → MTS (đa dạng thấp, sản lượng cao); “Tùy biến đại chúng” ở góc đa dạng cao + sản lượng cao. ¶Bảng vòng đời SP × môi trường SX (5 giai đoạn: phát triển SP → giới thiệu → tăng trưởng → trưởng thành → suy thoái): ¶• ETO: chỉ ở giai đoạn phát triển SP. ¶• MTO: có mặt ở cả 5 giai đoạn. ¶• ATO: giới thiệu, tăng trưởng, trưởng thành. ¶• MTS: giới thiệu, tăng trưởng (theo bảng slide). ¶• Tùy biến đại chúng: giới thiệu, tăng trưởng.
    B · Lập kế hoạch & Kiểm soát SX (MPC)
      5 điểm chính của MPC :: 1) Lập kế hoạch TỪ TRÊN XUỐNG, nối với kế hoạch kinh doanh & mục tiêu chiến lược. ¶2) Hệ thống KHÉP KÍN: xét giới hạn công suất, điều chỉnh theo phản hồi. ¶3) Cung tập trung năng suất; cầu hỗ trợ sắp ưu tiên. ¶4) Lặp đi lặp lại, chi tiết dần khi tầm hoạch định ngắn lại. ¶5) Hoạch định chiến lược = dài hạn; S&OP = trung hạn; MPS & MRP = ngắn hạn, chi tiết.
      S&OP – Hoạch định bán hàng & vận hành :: APICS: tập hợp mọi kế hoạch (bán hàng, marketing, SX, tài chính…) thành MỘT bộ kế hoạch tích hợp. ¶Lợi ích: ra quyết định vượt trội, tích hợp mọi chức năng · giao tiếp liên phòng ban · “một bộ số chung” · tái hoạch định hằng tháng theo biến động nhu cầu.
        Nguyên tắc định hướng :: Cam kết & hỗ trợ của lãnh đạo · Nói sự thật · Mục tiêu chung · Một bộ số vận hành chung · Cam kết · Đơn giản hóa – tập trung vào thay đổi.
        Quy trình S&OP hằng tháng :: Nhu cầu (từ dự báo đến định hình nhu cầu) → Nguồn cung (hoạch định năng lực, đánh đổi mạng lưới) → Cân bằng cung – cầu → Đối chiếu kế hoạch tài chính → Họp điều hành ra quyết định đồng thuận. ¶Tinh thần: “Nếu… thì sao?” thay vì “Đồng ý/Không đồng ý”.
        {vd} Bảng kế hoạch sản xuất :: Theo DÒNG SP, theo tháng. VD dòng “Dụng cụ cắm trại” T4–T11: 4.220 · 4.370 · 4.450 · 4.600 · 4.100 · 4.800 · 4.500 · 4.850; dòng “Vệ sinh gia đình”: 5.000 · 6.200 · 7.500 · 7.000 · 8.700 · 6.100 · 5.300 · 5.500.
      MPS – Lịch trình sản xuất tổng hợp :: APICS: nêu rõ yêu cầu từng THÀNH PHẨM theo thời gian & số lượng. Là cầu nối Marketing–Bán hàng–Vận hành, như “hợp đồng” giữa Sales và Sản xuất, đảm bảo cam kết giao hàng.
        3 mục tiêu MPS :: Duy trì mức dịch vụ KH mong muốn · Tận dụng tài nguyên · Giữ tồn kho ở mức mong muốn.
        5 đầu vào MPS :: Dự báo nhu cầu · Đơn đặt hàng xác nhận · Mức tồn kho (TP, NVL, linh kiện) · Năng lực SX (máy, nhân công) · Thời gian giao/lead time SX hoặc mua.
        Kết quả MPS :: Số lượng từng SP cần SX · tiến độ cho nhân viên · bao nhiêu có thể cam kết cho KH (ATP) · lượng còn lại dự kiến · kiểm soát SX tốt hơn · gắn kế hoạch kinh doanh với SX · tăng hiệu quả, giảm sai sót.
        {vd} Ví dụ bảng MPS :: SKU dụng cụ mở hộp cắm trại, môi trường MTS, tồn đầu 100, chiến lược Lot-for-Lot. Tuần 12–19 dự báo 600 · 620 · 750 · 700 · 870 · 610 · 530 · 550 → MPS 500 (= 600 − 100 tồn) · 620 · 750 · 700 · 870 · 610 · 530 · 550. Kế hoạch dòng (tháng) được tách xuống từng SKU (tuần): máy ép tỏi, dụng cụ mở hộp, túi lọc trà, kẹp hạt dẻ.
      MRP – Hoạch định nhu cầu NVL :: Quy trình hoạch định SX, lên lịch & kiểm soát tồn kho; có từ thế kỷ 20; dựa trên dự báo hoặc đơn hàng; áp dụng cho luồng theo kế hoạch lẫn theo đơn. Dùng để TÍNH nhu cầu phụ thuộc.
        3 mục tiêu MRP :: Đủ NVL cho SX và đủ SP để giao · Giảm tồn NVL & TP tối thiểu · Lập kế hoạch hoạt động SX, giao hàng, thu mua.
        4 đầu vào MRP :: MPS (SL & thời gian TP) · ISF – hồ sơ tình trạng tồn kho (thời gian thực, vị trí) · Yếu tố hoạch định (thông tin master từng vật tư: LT, quy cách lô…) · BOM – danh sách NVL, thành phần, cụm lắp ráp.
        {vd} Ví dụ MRP dụng cụ mở lon :: CÂY BOM (3 cấp): ¶• Cấp 0: Dụng cụ mở lon cắm trại – LẮP RÁP 2 tuần. ¶• Cấp 1: Phần thân (Body) ×1 – MUA 2 tuần · Lưỡi dao (Cutting Knife) ×2 – cụm LẮP RÁP 3 tuần. ¶• Cấp 2 (của 1 lưỡi dao): Bánh cắt (Cutter Wheel) ×1 – MUA 4 tuần · Bánh xe truyền động (Drive Wheel) ×1 – MUA 5 tuần. ¶B1 – Bung SP (product explosion): MPS tuần 12–19 = 500, 620, 750, 700, 870, 610, 530, 550 → lùi 2 tuần lắp ráp → lệnh lắp ráp tuần 10–17 = tổng nhu cầu cấp 1: Thân = 500, 620, 750, 700, 870, 610, 530, 550; Lưỡi dao (×2) = 1.000, 1.240, 1.500, 1.400, 1.740, 1.220, 1.060, 1.100. ¶B2 – MRP Thân (tồn đầu 2.100, L4L, mua 2 tuần): tồn sau tuần 10/11/12 = 1.600 / 980 / 230 → tuần 13 thiếu 700 − 230 = 470; tuần 14–17 cần 870, 610, 530, 550 → mỗi lệnh mua phát hành sớm 2 tuần. ¶B3 – MRP Lưỡi dao (tồn đầu 4.000, L4L, lắp ráp 3 tuần): tồn 3.000 / 1.760 / 260 → tuần 13 thiếu 1.400 − 260 = 1.140; rồi 1.740, 1.220, 1.060, 1.100 → lệnh lắp ráp phát hành sớm 3 tuần. Nhu cầu này lại bung tiếp xuống bánh cắt và bánh xe truyền động (mỗi lưỡi dao 1 cái).
        {!} Lưu ý dịch slide MRP :: Bản Việt ghi “Tổng nhu cầu – bánh cắt” cho dòng 1.000, 1.240…; bản gốc là “Gross Requirement – Cutting Knife” = LƯỠI DAO (cụm lắp ráp ×2), không phải bánh cắt (Cutter Wheel – linh kiện cấp 2).
        Thuật ngữ bảng MRP :: • Gross requirement – tổng nhu cầu. ¶• Stock / Projected available – tồn kho dự kiến. ¶• Net requirement – nhu cầu ròng = Tổng nhu cầu − Tồn kho sẵn có (nếu dương). ¶• Planned order receipt – kế hoạch nhận hàng (tuần cần hàng). ¶• Planned order release/issuing – kế hoạch phát lệnh = tuần nhận LÙI một khoảng lead time (offset lead time). ¶• Lot-for-Lot: lượng đặt = nhu cầu ròng từng kỳ.
      Khu vực chức năng (Work center) :: Một khu vực sản xuất trong nhà máy: một máy/nhóm máy, khu vực vật lý hoặc bộ kỹ thuật. Có năng lực dựa trên nhân công và/hoặc máy, dùng cho hoạch định năng lực. Thiết kế hợp lý → tăng năng suất & lợi nhuận.
      Năng lực sản xuất :: Mức tối đa hoạt động gia tăng giá trị trong một khoảng thời gian, điều kiện bình thường. ¶Thiếu năng lực → mất cơ hội kinh doanh. Thừa năng lực → chi phí từ năng lực không dùng. ¶Đánh đổi: đáp ứng nhu cầu (tận dụng tối ưu) vs khả năng tài chính đầu tư (chi phí thấp) → GIỮ CÂN BẰNG nhu cầu – tài nguyên.
        {f} Công suất định mức (Rated capacity) :: RC = Thời gian sẵn có × Utilization × Efficiency ¶Utilization = % thời gian hoạt động; Efficiency = sản lượng thực tế / tiêu chuẩn. ¶VD: 3 máy × 8 giờ × 5 ngày = 120 giờ/tuần; U = 75%, E = 110% → RC = 120 × 0,75 × 1,10 = 99 giờ tiêu chuẩn.
        {f} Công suất đã chứng minh (Demonstrated) :: = trung bình sản lượng thực tế các kỳ trước. VD 4 tuần: 110, 140, 120, 130 → (500)/4 = 125 giờ tiêu chuẩn.
  C6 · Tồn kho :: A – Khái niệm; B – Quản lý tồn kho; C – Bổ sung tồn kho. ¶Kết chương: quản lý & loại tồn kho · phân loại, mức độ, chi phí · khi nào bổ sung · đặt bao nhiêu.
    A · Khái niệm tồn kho
      Vì sao cần tồn kho? :: Dịch vụ KH · thời gian SX & giao hàng · sự không chắc chắn · độ rộng danh mục SP · hiệu suất (thu mua, nhận hàng, sản xuất) · hoạch định năng suất · cân bằng sản lượng · dự phòng. ¶Nhược điểm: tồn kho TỐN CHI PHÍ.
      Các loại tồn kho :: 1) NVL thô · 2) Dở dang (WIP) · 3) Thành phẩm (FG) · 4) Tồn an toàn · 5) Tồn chu kỳ · 6) Tồn đi đường (in-transit) · 7) MRO – vật tư bảo trì, sửa chữa, vận hành. ¶Xuất hiện dọc chuỗi (NCC NVL → NCC linh kiện → NSX → NPP → KH cuối): ¶• NCC: NVL hoặc linh kiện, MRO. ¶• Nhà SX: NVL, WIP, thành phẩm, MRO. ¶• Trung tâm phân phối (DC): hàng đóng gói, hàng đóng gói lô lớn, tồn chu kỳ, linh kiện trì hoãn (postponement – để hoàn thiện SP muộn), MRO. ¶• Cửa hàng bán lẻ: hàng đóng gói, MRO. ¶• Giữa mỗi tầng: tồn kho đi đường (in-transit/pipeline).
      4 chức năng tồn kho :: Slide chỉ nêu 4 tên; phần giải thích theo chuẩn APICS: ¶• Tồn an toàn (safety): chống biến động cung/cầu. ¶• Tồn dự trữ trước (anticipation): chuẩn bị cho mùa vụ, khuyến mãi, bảo trì. ¶• Tồn chu kỳ (cycle/lot-size): do mua/SX theo lô. ¶• Tồn phòng ngừa (hedge): chống tăng giá, đình công, gián đoạn.
      Nhân tố quyết định tồn an toàn :: Mức độ dịch vụ (tỷ lệ nhu cầu muốn đáp ứng) · Biến động nhu cầu (so với dự báo) · Biến động nguồn cung (thời gian, số lượng, độ chính xác SX, OTIF) · LEAD TIME – khoảng thời gian CCU đối mặt thay đổi.
      Tối ưu hóa tồn kho :: Cân bằng giữa các thành phần tồn kho, tránh DƯ THỪA (chi phí) và THIẾU HÀNG (rủi ro dịch vụ). ¶Các thành phần cộng lại thành MỨC TỒN KHO MỤC TIÊU (từ dưới lên): Tồn đi đường (transit) · Tồn chờ kiểm định chất lượng (QC stock) · Tồn an toàn · Tồn sản xuất trước (prebuild) · Tồn chu kỳ (cycle). ¶Tồn thực tế vượt mức mục tiêu = over-stock; thấp hơn = under-stock.
    B · Quản lý tồn kho
      Định nghĩa :: APICS: nhánh quản lý liên quan đến lập kế hoạch và kiểm soát tồn kho; thuộc kế hoạch dài hạn; nghiên cứu cách tồn kho di chuyển qua SX và cân bằng năng lực với nhu cầu.
      3 câu hỏi cốt lõi :: Giữ tồn kho nào? · Giữ bao nhiêu? · Khi nào đặt hàng? → “mức độ phù hợp”.
      Phân loại ABC & FMR :: Nền tảng Pareto 20/80 (20% nguyên nhân tạo 80% kết quả). 2 KPI chính của CCU: Mức tồn kho & ECSL (mức dịch vụ khách hàng). ¶Phân tích ABC theo doanh thu → tác động MỨC TỒN KHO; phân tích FMR theo tần suất dòng đơn → tác động ECSL (tần suất bổ sung). 20% SP chiếm 80% doanh thu; 20% SP chiếm 80% số dòng đơn hàng.
        ABC (theo giá trị bán) :: Tỷ lệ chuẩn 80% + 15% + 5% + 0% (D = Dead, hàng chết).
        FMR (theo tần suất) :: Dựa trên số dòng đơn bán (SO lines) cho TP và số dòng PO cho NVL; 80/15/5. F = luân chuyển nhanh · M = trung bình · R = chậm (Rare).
        Ma trận ABC × FMR :: AF (nhanh, giá trị cao) → giám sát chặt. ¶AR (chậm, giá trị cao) → tránh tồn kho (phần lớn hàng lỗi thời/chậm luân chuyển nằm ở đây). ¶CF (nhanh, giá trị thấp) → tự động hóa. ¶CR → lưu trữ hoặc không. ¶D (không giá trị) → tránh lưu trữ. ¶ABC/FMR định hướng ưu tiên SX, lưu trữ, bổ sung, vận hành kho; cần xem lại định kỳ.
      Tồn kho & mức độ dịch vụ :: Mức dịch vụ đo bằng nhiều cách. OTIF (On Time In Full – đúng hạn & đầy đủ) có thể tính theo: % sản phẩm được giao · % DÒNG ĐƠN HÀNG được giao · % đơn hàng được giao; và so với: ngày & số lượng KH YÊU CẦU ban đầu, hoặc ngày & số lượng ĐÃ CAM KẾT/xác nhận. ¶(Lưu ý: bản Việt dịch “order lines” thành “lượng sản phẩm đã giao” – đúng là “dòng đơn hàng”.) ¶Mức dịch vụ ở đây = khả năng có hàng trên kệ từ tồn kho, với giả định về thông số SX & cung ứng. ¶Đường cong: chi phí tồn kho tăng rất nhanh khi mức dịch vụ tiến gần 100% → tối ưu = đạt mức dịch vụ yêu cầu với chi phí tối thiểu.
      5 nhóm chi phí tồn kho :: 1) Chi phí sản phẩm (mua/SX 1 đơn vị) · 2) Chi phí lưu kho · 3) Chi phí đặt hàng (đặt & nhận) · 4) Chi phí hết hàng (mất doanh số) · 5) Chi phí liên quan năng lực (tăng ca, bảo trì).
    C · Bổ sung tồn kho
      Định nghĩa :: Đặt hàng kịp thời để duy trì mức tồn tối ưu; mục đích đủ năng lực cung đáp ứng KH; gồm theo dõi tồn kho + dự báo nhu cầu.
      Khi nào đặt hàng?
        Hệ thống 2 thùng (Two-bin) :: 6 bước: 2 thùng cạnh nhau (thùng 1 trước) → đáy mỗi thùng có thẻ tái đặt hàng → lấy hàng thùng 1 trước → thùng 1 hết, lấy thùng 2 → dùng thẻ để đặt bù thùng 1 → hàng về đổ vào thùng rỗng, chu kỳ lặp lại. Dạng kanban đơn giản.
        Mô hình Q (điểm tái đặt hàng) :: Số lượng đặt CỐ ĐỊNH, thời điểm thay đổi: đặt khi tồn chạm ROP (điểm A), hàng về sau một lead time (điểm B) đúng lúc tồn chạm mức an toàn. ¶ROP = Nhu cầu trong lead time + Tồn an toàn. (Nguồn: CPIM Inventory Management)
          {vd} Bài tập ROP :: (Ví dụ tự luyện, không có trên slide) Nhu cầu 50 đv/ngày, LT 6 ngày, SS 100 đv → ROP = 50×6 + 100 = 400 đv: khi tồn còn 400 thì đặt hàng.
        Mô hình P (định kỳ) :: Thời điểm CỐ ĐỊNH (chu kỳ đều), số lượng thay đổi theo mức thiếu. Hình slide: đặt hàng theo nhịp đều; nếu nhu cầu tăng giữa kỳ có thể dùng tới tồn an toàn, thậm chí hết hàng. ¶(Bổ sung) Cần SS cao hơn mô hình Q vì phải che cả chu kỳ + LT. Lượng đặt tính bằng POQ.
        MRP :: Đặt theo nhu cầu tính toán từ MPS + BOM (xem C5).
      Đặt bao nhiêu?
        Lot-for-Lot (L4L) :: APICS: số lượng đặt = nhu cầu ròng từng kỳ, không theo EOQ hay cố định. Dùng khi: tính MRP/MPS · môi trường tinh gọn · hàng đắt hoặc hiếm dùng · hàng dễ hỏng · hàng chiếm nhiều diện tích.
        {f} EOQ – số lượng đặt hàng kinh tế :: EOQ = √(2DS / H) ¶D = nhu cầu năm (đơn vị) · S = chi phí mỗi lần đặt · H = chi phí lưu kho/đơn vị/năm. ¶Tại EOQ: chi phí đặt hàng = chi phí lưu kho, tổng chi phí thấp nhất (đánh đổi đặt hàng vs lưu trữ). Đồ thị: chi phí lưu kho tăng theo Q, chi phí đặt hàng giảm theo Q, tổng chi phí hình chữ U, đáy tại Q*.
          {vd} Bài tập EOQ :: (Ví dụ tự luyện, không có trên slide) D = 1.200 đv/năm, S = 50.000đ/lần đặt, H = 3.000đ/đv/năm. ¶EOQ = √(2 × 1.200 × 50.000 / 3.000) = √40.000 = 200 đv/lần → 6 lần đặt/năm. ¶Kiểm tra: CP đặt = 6 × 50.000 = 300.000đ; CP lưu kho = (200/2) × 3.000 = 300.000đ → bằng nhau.
        {f} POQ – đặt hàng theo chu kỳ :: Số lượng đặt = Mức tối đa − Tồn hiện tại ¶Mức tối đa = D(T + L) + SS ¶D = nhu cầu/đơn vị thời gian · T = khoảng giữa 2 lần đặt · L = lead time · SS = tồn an toàn. ¶Cố định THỜI GIAN thay vì số lượng (gắn với mô hình P).
          {vd} Bài tập POQ :: (Ví dụ tự luyện, không có trên slide) D = 20 đv/ngày, T = 7 ngày, L = 3 ngày, SS = 40, tồn hiện tại 90. ¶Max = 20 × (7 + 3) + 40 = 240 → Lượng đặt = 240 − 90 = 150 đv.
  C7 · Thu mua :: A – Khái niệm thu mua; B – Thực thi quy trình thu mua. ¶Kết chương: vai trò, cơ cấu, mục tiêu · quy trình chuẩn · chiến lược quản lý quan hệ NCC · KPI hiệu suất NCC.
    A · Khái niệm thu mua
      Tổng quan :: THU MUA (Procurement) = TÌM NGUỒN CUNG (Sourcing) + MUA HÀNG (Purchasing). Mục tiêu: mang lại lợi nhuận cao nhất cho tổ chức. ¶Hoạt động: xác định & chọn NCC · mua, đàm phán, ký hợp đồng · theo dõi giao hàng & thanh toán · tiếp cận, đánh giá thị trường NCC · đánh giá & phát triển NCC · phát triển hệ thống thu mua.
      {!} Lưu ý thuật ngữ :: C1 dịch “Mua hàng = Tìm nguồn cung + Thu mua”, C7 dịch “Thu mua = Tìm nguồn cung + Mua hàng”. Bản tiếng Anh thống nhất: Procurement = Sourcing + Purchasing.
      Vai trò của thu mua :: • Chiến lược: tìm NCC, tối ưu tiết kiệm chi phí, phù hợp mục tiêu công ty. ¶• Tiếp cận thị trường: nắm công nghệ mới, tìm vật liệu/dịch vụ mới, phát triển NCC mới, theo dõi xu hướng. ¶• Quản lý phát triển NCC: phát triển NCC hiện có, cùng NCC phát triển SP mới, rút ngắn thời gian phát triển.
      {f} Tác động tài chính :: Tăng ROI và tăng dòng tiền. ¶ROI = Lợi nhuận ròng / Tổng chi phí đầu tư (bản gốc: Return (Benefit) / Investment (Cost)). ¶Tăng dòng tiền bằng: kéo dài thời hạn thanh toán nợ phải trả · giảm tồn kho. ¶Thu mua cân bằng tam giác DỊCH VỤ – CHI PHÍ – TIỀN MẶT.
      6 mục tiêu bộ phận thu mua :: Giảm chi phí · cải thiện hiệu suất CCU · cập nhật công nghệ · nâng hiệu quả thời gian cung ứng · kết nối NCC trong phát triển SP · tối ưu quy trình.
      3 loại nguồn cung :: • Độc quyền (Sole): thị trường chỉ có 1 NCC. ¶• Đa nguồn (Multiple): nhiều NCC cho cùng SP. ¶• Đơn nguồn (Single): CHỌN 1 NCC dù có lựa chọn khác. ¶Phân biệt Sole (không có lựa chọn) vs Single (chủ động chọn 1).
    B · Thực thi quy trình thu mua
      Quy trình thu mua 6 bước :: Xác định nhu cầu → Đánh giá NCC tiềm năng → Đấu thầu, đàm phán, chọn NCC → Phê duyệt mua hàng → Nhận hàng & thanh toán → Đánh giá hiệu quả NCC.
      Đánh giá & lựa chọn NCC :: Xác định nhu cầu → Xác định yêu cầu chính → Quyết định chiến lược chọn NCC → Xác định NCC tiềm năng → Sàng lọc NCC → Quyết định phương pháp đánh giá & lựa chọn → Lựa chọn & ký hợp đồng.
      SRM – Quản lý quan hệ NCC :: Cách tiếp cận toàn diện bao quát mọi tương tác KH–NCC: thúc đẩy hành vi NCC · bao quát toàn diện quan hệ hai DN · tận dụng quy mô nhờ phối hợp giữa các bộ phận, chức năng, cấp bậc.
        7 lợi ích SRM :: Quản lý chi phí tốt hơn, giảm chi phí · tăng hiệu quả vận hành · giảm biến động giá · hợp nhất CCU tốt hơn · quan hệ NCC bền vững hơn · giảm lãng phí · tăng tiềm năng thuê ngoài.
        5 cấp độ quan hệ :: 5 đặc điểm so sánh: Mức gần gũi · Tầm nhìn (chia sẻ thông tin) · Tương tác với đối thủ của NCC · Giao tiếp · Văn hóa. ¶1) Giao dịch (Transactional): giữ khoảng cách, ngắn hạn · chỉ chia sẻ yêu cầu mua · đối thủ: nhiều · giao tiếp qua máy tính · văn hóa: không quan trọng. ¶2) Ưu tiên (Preferred – liên tục): trung hạn · chia sẻ một số · đối thủ: một vài · có điểm liên lạc chỉ định · nhận thức văn hóa. ¶3) Chiến lược – Đối tác (Partnership): dài hạn hơn · chia sẻ đầy đủ · đối thủ: hạn chế · tương tác giữa các phòng ban · nhận thức + thích ứng. ¶4) Chiến lược – Hợp tác/Liên minh (Alliance): quan hệ dài hạn · chia sẻ + coi kế hoạch đối tác như của mình · đối thủ: hạn chế/không có · giao tiếp sâu rộng, tin cậy cao, cấp phép · văn hóa hợp nhất dần. ¶5) Sở hữu (Sáp nhập/Mua lại): sở hữu · thông tin nội bộ chung · không có đối thủ · giao tiếp đa dạng · MỘT văn hóa.
        SRM 3 bước :: Phân khúc & phân loại NCC (bản đồ theo khả năng sinh lời & rủi ro) → Phát triển chiến lược NCC (phân bổ nguồn lực nội bộ) → Thực thi chiến lược cùng NCC.
      Ma trận Kraljic (góc nhìn công ty) :: Trục dọc: tác động kinh doanh (CHI PHÍ); trục ngang: độ phức tạp thị trường cung (RỦI RO). ¶• Thường nhật (thấp/thấp) – tinh giản thủ tục. ¶• Đòn bẩy (chi phí cao, rủi ro thấp) – tận dụng sức mua, đấu thầu. ¶• Nút thắt cổ chai (chi phí thấp, rủi ro cao) – đảm bảo nguồn, dự phòng. ¶• Chiến lược/Quan trọng (cao/cao) – quan hệ đối tác dài hạn. ¶(Slide chỉ nêu tên 4 ô và 2 trục; cách ứng xử từng ô là kiến thức bổ sung theo mô hình Kraljic gốc.)
      Ma trận góc nhìn nhà cung cấp :: Trục dọc: mức HẤP DẪN của tài khoản (khách hàng) với NCC; trục ngang: GIÁ TRỊ TƯƠNG ĐỐI (doanh thu) của khách hàng với NCC. ¶• Phiền toái – Nuisance (thấp/thấp). Ai: doanh thu thấp, NCC không định đầu tư (trừ khi có chiến lược cơ hội rõ). Dấu hiệu: giao nhân viên cấp dưới, phản hồi chậm, viện dẫn hợp đồng khi bị hỏi phạm vi, không hỗ trợ ngoài hợp đồng, cho rằng KH kiêu ngạo, cản trở KH cải thiện hiệu suất NCC. ¶• Khai thác – Exploitable (doanh thu cao, hấp dẫn thấp). Ai: doanh thu cao, không định đầu tư, dễ có lỗi SP/DV. Dấu hiệu: viện dẫn hợp đồng, TÍNH PHÍ hoạt động ngoài hợp đồng kể cả khi đôi bên cùng lợi, cho rằng KH kiêu ngạo, cản trở cải thiện. ¶• Cơ hội – Opportunity (hấp dẫn cao, doanh thu thấp). Ai: hiện thu thấp nhưng tiềm năng thành Cốt lõi, tăng biên lợi nhuận. Dấu hiệu: liên hệ chủ động qua quản lý chuyên trách, đáp ứng nhanh, háo hức làm ăn mới & loại đối thủ, chủ động đề xuất cải tiến. ¶• Cốt lõi – Core (cao/cao). Ai: tài khoản trọng yếu hiện tại & tương lai, có kế hoạch đầu tư. Dấu hiệu: nỗ lực giữ tài khoản, liên hệ chủ động, đáp ứng nhanh, muốn làm việc tích hợp, đề xuất cải tiến, HỖ TRỢ ngoài hợp đồng.
      Kết hợp 2 ma trận :: Đối chiếu Kraljic (người mua) với góc nhìn NCC. Trục ngang: mức PHỤ THUỘC VÀO NCC (Thường nhật → Đòn bẩy → Nút thắt → Chiến lược); trục dọc: mức PHỤ THUỘC VÀO KH (Phiền toái → Khai thác → Cơ hội → Cốt lõi). ¶• Chiến lược × Cốt lõi = “Good match”; Nút thắt/Chiến lược × Cơ hội/Cốt lõi = cơ hội chung. ¶• Thường nhật/Đòn bẩy × Cốt lõi/Cơ hội = bất lợi cho NCC. ¶• Nút thắt/Chiến lược × Khai thác/Phiền toái = bất lợi cho NGƯỜI MUA. ¶• Thường nhật × Khai thác = rủi ro giá; Đòn bẩy × Khai thác = dễ xung đột; Thường nhật × Phiền toái = thờ ơ đôi bên; Đòn bẩy × Phiền toái = rủi ro nguồn cung.
      SPM – Quản lý hiệu suất NCC :: Tích hợp phân tích đánh giá hiệu suất, quyết định, khuyến khích và xử phạt NCC; quy trình + hệ thống thu thập thông tin để đo, xếp hạng, đánh giá NCC liên tục.
        6 KPI hiệu suất NCC :: 1) Chất lượng – đạt chuẩn? tần suất hàng kém/sai loại? ¶2) Đánh giá rủi ro – tuân thủ pháp luật, khai thác có đạo đức, rủi ro danh tiếng. ¶3) Vận chuyển – nguyên vẹn, đúng hạn, mở rộng cho đơn lớn/gấp, tỷ lệ mất/trễ/hỏng. ¶4) Tiết kiệm chi phí – tần suất tăng giá, lợi thế quy mô, đàm phán hợp đồng. ¶5) Dịch vụ KH – giải quyết vấn đề nhanh, giao tiếp, xử lý khiếu nại. ¶6) Mở rộng & đổi mới – cải tiến liên tục, đề xuất vật liệu mới.
  C8 · Quản trị rủi ro :: A – Giới thiệu; B – Quy trình quản trị rủi ro. ¶Kết chương: định nghĩa rủi ro & QTRR · rủi ro CCU & phân loại · quy trình tiêu chuẩn · công thức đánh giá rủi ro.
    A · Giới thiệu quản trị rủi ro
      Định nghĩa rủi ro :: Phải hiểu PHẠM VI và KHOẢNG THỜI GIAN xảy ra rủi ro trước khi chọn cách ứng phó; mỗi rủi ro cần mốc thời gian (ngày, tháng, năm) và quan điểm cụ thể xác định phạm vi. (APICS)
      Quản trị rủi ro là gì? :: APICS: xác định, đánh giá, sắp ưu tiên rủi ro; phối hợp nguồn lực để GIẢM THIỂU, GIÁM SÁT, KIỂM SOÁT xác suất và ảnh hưởng của sự kiện xấu; hoặc TỐI ĐA HÓA cơ hội.
      5 nhóm rủi ro CCU :: Chi phí · Chất lượng · Vận chuyển · Pháp lý · Danh tiếng.
      Ma trận biết/không biết (Cleden 2009) :: Hai trục: nhận biết khả năng xuất hiện × nhận biết tác động. ¶• Biết cái biết: hiểu rõ → chia sẻ minh bạch, ghi nhận như giả định. ¶• Biết cái không biết: biết có thứ không đoán được → nghiên cứu chủ động, chuẩn bị dự phòng. ¶• Không biết cái biết: người khác biết mà ta không → người khác chia sẻ minh bạch. ¶• Không biết cái không biết: → môi trường thử nghiệm, học liên tục, áp dụng bài học cũ.
    B · Quy trình quản trị rủi ro
      Quy trình 4 bước (APICS CPIM 2023) :: 1) Xác định rủi ro → 2) Phân tích & đánh giá → 3) Phát triển kế hoạch phản ứng → 4) Thực thi & giám sát; tất cả trong chiến lược quản lý rủi ro, lặp lại liên tục.
        1 · Xác định rủi ro :: Nguồn: môi trường bên ngoài · quy trình nội bộ · chuỗi cung ứng · nguồn nhân lực. ¶Công cụ: brainstorm · đánh giá rủi ro trước đây · khảo sát · tài liệu tham khảo (BS 31100:2008, ISO 31010:2009) · tư vấn chuyên gia.
        2 · Phân tích & đánh giá :: Theo 2 chiều: Tác động và Xác suất.
        3 · Phát triển phản ứng :: Tránh · Chấp nhận · Chuyển giao · Giảm thiểu.
        4 · Thực thi & giám sát :: Bản gốc: Tests and audits (kiểm tra & đánh giá/audit) · Action debriefs (rút kinh nghiệm sau hành động). Bản Việt: Đánh giá lại · Phản hồi hành động. ¶Sau đó quay về “Đánh giá chiến lược quản trị rủi ro” rồi lặp lại vòng mới.
      {f} Điểm rủi ro :: Điểm rủi ro = Khả năng (xác suất) × Hậu quả (tác động) → điểm 1–25. ¶Thang KHẢ NĂNG: 1 Hiếm (<0,1%) · 2 Khó xảy ra (0,1–1%) · 3 Có thể (1–10%) · 4 Nhiều khả năng (10–50%) · 5 Gần như chắc chắn (>50%). ¶Thang TÁC ĐỘNG: 1 Không đáng kể · 2 Nhỏ · 3 Trung bình · 4 Lớn · 5 Thảm khốc. ¶Xếp hạng điểm: 1–3 THẤP · 4–6 TRUNG BÌNH · 8–12 CAO · 15–25 CỰC CAO.
        {vd} Ví dụ ma trận rủi ro :: Trộm cắp (Theft): 5 × 1 = 5 → trung bình. ¶Đình công (Strike): 4 × 4 = 16 → cực cao, ưu tiên số 1. ¶Truyền thông (Media): 3 × 5 = 15 → cực cao. ¶Hỏa hoạn (Fire): 2 × 5 = 10 → cao. ¶Bài học: rủi ro xảy ra thường xuyên nhất (trộm) chưa chắc nguy hiểm nhất.
        {!} Lưu ý dịch slide rủi ro :: Bản Việt dịch “Strike” là “Bị tấn công”; trong ngữ cảnh CCU, Strike = ĐÌNH CÔNG (bãi công). Thang khả năng và bảng xếp hạng màu nằm ở dạng hình trong slide nên dễ bị bỏ sót khi đọc.
      4 chiến lược ứng phó :: • Chấp nhận: không hành động. ¶• Tránh: loại bỏ hoàn toàn rủi ro. ¶• Giảm thiểu: giảm khả năng hoặc tác động. ¶• Chuyển giao: chuyển sang bên khác (bảo hiểm, thuê ngoài, hợp đồng).
      Phân tích hình nơ (Bow-tie) :: Trái → phải: Nguyên nhân có thể → Hành động giảm KHẢ NĂNG (phòng ngừa) → SỰ KIỆN RỦI RO (tâm nơ) → Hành động giảm HẬU QUẢ (khắc phục) → Hậu quả có thể.
  C9 · Dịch vụ Logistics :: A – Định nghĩa; B – Quản lý kho bãi; C – Dịch vụ hải quan; D – Vận tải & giao nhận. ¶Kết chương: tổng quan & loại hình dịch vụ · nhà cung cấp dịch vụ logistics · thủ tục & chứng từ hải quan · trụ cột kho bãi & vận tải.
    A · Định nghĩa dịch vụ logistics
      Định nghĩa :: Hoạt động & quy trình lập kế hoạch, điều phối, thực hiện dịch chuyển hàng hóa, dịch vụ, thông tin từ điểm xuất phát đến điểm tiêu thụ.
      11 bước chuỗi logistics XNK :: 1) Đưa hàng lên phương tiện · 2) Nhận hàng tại kho, lưu trữ · 3) Đóng container · 4) Hải quan điểm xuất · 5) Dịch vụ cảng điểm xuất · 6) Vận tải quốc tế (bộ, biển, hàng không) · 7) Hải quan điểm nhập · 8) Dịch vụ cảng điểm nhập · 9) Rút hàng khỏi container, nhập kho · 10) Đưa lên xe tải · 11) Giao đến khách hàng cuối.
      Các loại dịch vụ logistics :: Kho bãi · Vận chuyển phân phối · Dịch vụ gia tăng · Dịch vụ hải quan · Dịch vụ hậu mãi.
      1PL → 5PL :: • 1PL: nhà SX tự giao bằng đội xe riêng. ¶• 2PL: công ty vận tải chở hàng từ NSX đến KH. ¶• 3PL: thuê công ty logistics quản lý lưu kho, đóng gói, vận chuyển, xử lý đơn. ¶• 4PL: công ty logistics thay mặt NSX quản lý các bên 3PL. ¶• 5PL: quản lý toàn bộ CCU của NSX từ SX đến giao hàng.
    B · Quản lý kho bãi
      Định nghĩa kho bãi :: APICS 16th: hoạt động nhận, lưu trữ, vận chuyển hàng hóa tới và từ địa điểm SX hoặc phân phối.
      5 hoạt động kho :: • Nhận hàng: dỡ, kiểm tra, ghi nhận, quyết định vị trí. ¶• Lưu trữ: giữ hàng cho dùng/chuyển tương lai. ¶• Vận chuyển/chuyển giao: theo 1 chứng từ vận chuyển. ¶• Chuẩn bị đơn/lấy hàng (picking). ¶• Kho phân phối: lưu TP và hoàn thiện đơn KH.
      4 trụ cột vận hành kho :: Bố trí mặt bằng · Quy trình · Con người · Hệ thống.
    C · Dịch vụ hải quan
      Thủ tục hải quan :: Luật Hải quan VN 2014: nghiệp vụ người khai & công chức hải quan thực hiện với hàng XNK, quá cảnh và phương tiện vận tải xuất cảnh, nhập cảnh, quá cảnh.
      Văn bản hướng dẫn :: Nghị định 08/2015/NĐ-CP · Nghị định 59/2018/NĐ-CP (sửa NĐ 08) · Thông tư 38/2015/TT-BTC · Thông tư 39/2018/TT-BTC (sửa TT 38) · Thông tư 39/2015/TT-BTC (trị giá hải quan). ¶Lưu ý: văn bản có thể đã được sửa đổi sau thời điểm giáo trình; cần tra cứu bản hiện hành khi áp dụng thực tế.
      Biểu thuế XNK :: Bảng tổng hợp thuế suất Nhà nước quy định; cơ sở tra mã HS và xác định thuế suất. ¶• Thuế NK ưu đãi: hàng từ nước có quan hệ MFN với VN (~180 nước). ¶• Thuế NK ưu đãi đặc biệt: theo hiệp định song phương/đa phương (ACFTA, ATIGA…). ¶• Thuế NK thông thường: nước không hưởng ưu đãi; thường = 150% thuế suất ưu đãi. ¶• Thuế bổ sung: áp thêm theo điều kiện cụ thể. ¶Slide có mã QR/link tải Biểu thuế XNK: https://t.ly/Rle2s
      {!} Lưu ý thuế ưu đãi đặc biệt :: Slide ghi “mức thuế có thể vượt quá thuế ưu đãi”. Trong thực tế, thuế suất ưu đãi đặc biệt (FTA) thường THẤP HƠN hoặc bằng thuế MFN – đó là lý do doanh nghiệp xin C/O form E, D… Nên kiểm tra lại với giảng viên.
      7 chứng từ xuất khẩu tiêu chuẩn :: Hợp đồng mua bán (Sales Contract) · Hóa đơn thương mại (Commercial Invoice) · Phiếu đóng gói (Packing List) · Vận đơn đường biển (Bill of Lading – B/L) · Tờ khai hải quan (Customs Declaration) · Giấy chứng nhận xuất xứ (C/O) · Delivery Order (D/O – slide dịch “Giấy xác nhận giao hàng”; thuật ngữ phổ biến là “Lệnh giao hàng”).
    D · Vận tải & Giao nhận
      Định nghĩa vận tải :: Di chuyển người, động vật, hàng hóa bằng phương tiện trên hạ tầng; tạo cả hệ quả tiêu cực (ô nhiễm, tắc nghẽn, tai nạn). “Vận tải là dây thần kinh và mạch máu của nền kinh tế.” ¶APICS 16th: chức năng lập kế hoạch, lịch trình, kiểm soát phương thức, nhà vận chuyển và sự di chuyển hàng tồn kho vào/ra tổ chức.
      2 mục tiêu vận tải :: Di chuyển sản phẩm (đúng nơi, đúng ngày giờ) · Lưu trữ sản phẩm (phương tiện là kho tạm thời).
      Vận tải trong chuỗi giá trị :: Chuỗi giá trị (Porter): hoạt động chính = logistics đầu vào → vận hành → logistics đầu ra → kinh doanh & marketing → dịch vụ sau bán; hỗ trợ = hành chính, nhân sự, hệ thống thông tin, mua hàng, tài chính/kế toán. TMĐT tạo thêm chuỗi giá trị: thanh toán & mua hàng, vận chuyển – theo dõi – giao hàng, dịch vụ KH.
      Mắt xích then chốt :: Dưới góc độ CCU, vận tải tác động lớn tới quản lý & chi phí phân phối vật lý. Trong quản lý logistics tích hợp thế kỷ 21, vận tải là yếu tố then chốt của logistics đầu vào/đầu ra và là “chất keo” giữ CCU gắn kết. ¶Hình slide dùng SCOR phiên bản CŨ: PLAN – SOURCE – MAKE – DELIVER – RETURN, nối NCC → nhà máy → NPP → bán lẻ → KH. (So với SCOR DS ở C1: Make ≈ Transform, Deliver ≈ Fulfill; DS thêm Order và Orchestrate.)
      Giao nhận (Delivery) :: Giai đoạn cuối CCU: Quản lý đơn hàng + Hoạt động kho bãi + Hoạt động vận tải; gồm nhận đơn, lập hóa đơn, quản lý TP, tài sản, vòng đời SP, yêu cầu XNK. ¶Đánh đổi: vận tải ảnh hưởng cả KHẢ NĂNG ĐÁP ỨNG lẫn HIỆU QUẢ; vận chuyển NHANH đắt hơn nhưng giúp phản ứng nhanh → giữ tồn kho thấp hơn, ít cơ sở/tài nguyên hơn. ¶Cấu trúc chi phí trên slide: NCC (chi phí NVL) → vận tải → nhà SX (chi phí SX) → vận tải → kho & DC (chi phí tồn kho) → vận tải → KH. Vận tải xuất hiện ở MỌI chặng.
      7R – Bảy nguyên tắc vàng :: Theo slide gốc (vòng tròn 1→7): (1) Đúng SẢN PHẨM · (2) Đúng KHÁCH HÀNG · (3) Đúng THỜI GIAN · (4) Đúng NƠI · (5) Đúng TÌNH TRẠNG · (6) Đúng SỐ LƯỢNG · (7) Đúng CHI PHÍ. ¶Mẹo nhớ: 7R = 6 ĐÚNG của dịch vụ KH ở C1 (SP, điều kiện, số lượng, địa điểm, thời gian, KH) + ĐÚNG CHI PHÍ.
        {!} Lưu ý dịch slide 7R :: Bản Việt thay “Đúng số lượng” bằng “Đúng chất lượng”. Bản gốc tiếng Anh là RIGHT QUANTITY – học theo bản gốc.
      Phương thức – Phương tiện – Loại hình :: • Phương thức (mode): đường bộ, biển, hàng không, sắt, ống. ¶• Phương tiện: tàu, sà lan, xe tải, máy bay… ¶• Loại hình (cách thực hiện vận chuyển): Đơn phương thức (1 mode) · Liên phương thức – Intermodal (nhiều mode, theo slide Việt: KHÔNG đổi phương tiện chứa hàng – VD cùng một container) · Đa phương thức – Multimodal (nhiều mode, CÓ thay đổi phương tiện) · Vận tải kết hợp – Combined (tùy biến linh hoạt theo yêu cầu). ¶(Bổ sung) Theo thông lệ quốc tế, đa phương thức thường chỉ do MỘT người kinh doanh vận tải đa phương thức chịu trách nhiệm theo MỘT hợp đồng/chứng từ.
      5 phương thức & phương tiện :: • HÀNG KHÔNG: Hàng kiện (Package) – đi bằng máy bay chở hàng (Freighter) hoặc khoang bụng máy bay khách (Belly hold) · Hàng siêu trọng (Heavy). ¶• ĐƯỜNG BIỂN: Hàng bách hóa đóng kiện (Break-bulk) · Hàng lỏng xá (Liquid bulk) · Tàu RoRo (xe tự lăn lên/xuống) · Hàng rời khô (Dry bulk) · Container (ISO tiêu chuẩn, lạnh – Reefer, mặt bằng – Flatrack, bồn – Tank). ¶  Thủy nội địa/ven biển: tàu sông–biển · tàu kéo sà lan (sà lan bồn, sà lan boong, sà lan hàng rời) · container. ¶• ĐƯỜNG SẮT: Tàu chuyên tuyến (Unit train) · Hàng theo toa (Carload: toa kín, toa bồn, toa sàn phẳng, toa lạnh, toa hàng rời đáy phễu, toa mở – Gondola) · Liên vận (Intermodal: TOFC – rơ moóc xe tải trên toa, container nội địa). ¶• ĐƯỜNG BỘ: Hàng kiện (Package) · Hàng lẻ (LTL) · Nguyên xe (TL: xe thùng kín – Dry van, xe bồn, sàn phẳng, bạt rèm, xe lạnh, xe hàng rời, xe mui trần, khung gầm chở container – Chassis). ¶• ĐƯỜNG ỐNG: dầu, khí, nước.

  ∑ Công thức cần nhớ :: Tổng hợp mọi công thức tính toán trong 9 chương – trọng tâm bài tập.
    {f} Thống kê (C2) :: Mean = Σx/n · Median = giá trị giữa · Mode = xuất hiện nhiều nhất · Range = max − min ¶MAD = Σ|xᵢ − x̄| / n ¶SD = √(Σ(x − μ)² / N)
    {f} Dự báo (C4) :: Naive: Fₜ₊₁ = Xₜ ¶MA: Fₜ₊₁ = (Xₜ + … + Xₜ₋ₙ₊₁)/n ¶WMA: Fₜ₊₁ = Σ(wX)/Σw ¶ES: Fₜ = αDₜ₋₁ + (1−α)Fₜ₋₁; α = 2/(n+1) ¶Chỉ số mùa vụ = TB kỳ / TB chung; Dự báo kỳ = chỉ số × (dự báo năm / số kỳ)

    {f} Tồn kho (C6) :: ROP = Nhu cầu trong LT + SS ¶EOQ = √(2DS/H) ¶POQ: Q = Max − Tồn hiện tại; Max = D(T + L) + SS

    Kế hoạch & sản xuất :: SCOR DS – Supply Chain Operations Reference, Digital Standard (mô hình tham chiếu vận hành CCU) ¶S&OP – Sales & Operations Planning (hoạch định bán hàng & vận hành) ¶IBP – Integrated Business Planning (kế hoạch KD tích hợp) ¶MPC – Manufacturing Planning & Control (lập kế hoạch & kiểm soát SX) ¶MPS – Master Production Schedule (lịch trình SX tổng hợp) ¶RCCP – Rough Cut Capacity Planning (hoạch định năng lực sơ bộ) ¶MRP – Material Requirements Planning (hoạch định nhu cầu NVL) ¶CRP – Capacity Requirements Planning (hoạch định nhu cầu năng lực) ¶FAS – Final Assembly Schedule (lịch lắp ráp cuối) ¶PAC – Production Activity Control (kiểm soát hoạt động SX) ¶MES – Manufacturing Execution System · APS – Advanced Planning & Scheduling ¶BOM – Bill of Materials (danh mục NVL) ¶ISF – Inventory Status File (hồ sơ tình trạng tồn kho) ¶ATP – Available to Promise (lượng có thể cam kết) ¶ETO / MTO / ATO / MTS – Engineer / Make / Assemble to Order, Make to Stock ¶EHS – Environment, Health, Safety ¶ERP – Enterprise Resource Planning (hệ thống hoạch định nguồn lực DN) ¶R&D – Research & Development (nghiên cứu & phát triển) ¶TQM – Total Quality Management (quản lý chất lượng toàn diện) ¶RC – Rated Capacity (công suất định mức) ¶B2C – Business to Consumer ¶OE – Orchestrate (cấp 0 của SCOR DS) · RL – mã chỉ số Reliability (độ tin cậy) trong SCOR, VD RL.3.47 Forecast Accuracy ¶TIMWOODS – 8 loại lãng phí (Transport, Inventory, Motion, Waiting, Overproduction, Over-processing, Defects, Skills)
    Dự báo & tồn kho :: MAPE – Mean Absolute Percent Error ¶RMSE – Root Mean Square Error ¶MAD – Mean Absolute Deviation · SD – Standard Deviation ¶CoV – Coefficient of Variation (hệ số biến thiên) ¶FVA – Forecast Value Add ¶DOS – Days of Supply (số ngày tồn kho) ¶SS – Safety Stock ¶ROP – Reorder Point ¶EOQ – Economic Order Quantity ¶POQ – Periodic Order Quantity ¶L4L – Lot-for-Lot ¶OTIF – On Time In Full ¶ECSL – mức dịch vụ khách hàng (Customer Service Level) ¶WIP – Work in Process · FG – Finished Goods · RM – Raw Materials ¶MRO – Maintenance, Repair, Operating supplies ¶FMR – Fast / Medium / Rare moving ¶SO / PO lines – dòng đơn bán / dòng đơn mua ¶UCL / LCL – giới hạn kiểm soát trên / dưới ¶ABC – phân loại theo GIÁ TRỊ (Pareto) · XYZ – phân loại theo ĐỘ BIẾN ĐỘNG nhu cầu ¶SKU – Stock Keeping Unit (mã hàng) ¶OOS – Out of Stock (hết hàng) ¶BIAS – độ thiên lệch của dự báo ¶MA / WMA / ES / YTD – Moving Average / Weighted Moving Average / Exponential Smoothing / Year-to-date average ¶LT – Lead Time (thời gian chờ/thời gian giao hàng)

    Thu mua, rủi ro & logistics :: SRM – Supplier Relationship Management ¶SPM – Supplier Performance Management ¶ROI – Return on Investment ¶KPI – Key Performance Indicator ¶ASCM / APICS – hiệp hội CCU cấp chứng chỉ CPIM, CSCP… ¶BS 31100 · ISO 31010 – tiêu chuẩn quản trị rủi ro ¶LSP – Logistics Service Provider · 1PL → 5PL ¶DC – Distribution Center ¶LTL – Less than Truckload (hàng lẻ) · TL – Truckload (nguyên xe) ¶TOFC – Trailer on Flat Car · RoRo – Roll-on/Roll-off ¶B/L – Bill of Lading · C/O – Certificate of Origin · D/O – Delivery Order ¶HS code – mã phân loại hàng hóa ¶MFN – Most Favoured Nation (tối huệ quốc) ¶FTA – Free Trade Agreement · ACFTA (ASEAN–Trung Quốc) · ATIGA (Hiệp định thương mại hàng hóa ASEAN)
    Viết tắt tiếng Việt trong sơ đồ :: CCU – chuỗi cung ứng ¶KH – khách hàng (“kế hoạch” luôn viết đầy đủ, không viết tắt, để khỏi nhầm) ¶NCC – nhà cung cấp · NSX – nhà sản xuất · NPP – nhà phân phối ¶DN – doanh nghiệp · KD – kinh doanh ¶SP / DV – sản phẩm / dịch vụ ¶SX – sản xuất · NVL – nguyên vật liệu · TP – thành phẩm · BTP – bán thành phẩm ¶SL – số lượng · TB – trung bình ¶TMĐT – thương mại điện tử ¶XNK – xuất nhập khẩu · NK – nhập khẩu ¶CSKH – chăm sóc khách hàng · CSDL – cơ sở dữ liệu ¶QTRR – quản trị rủi ro ¶NĐ-CP – Nghị định Chính phủ · TT-BTC – Thông tư Bộ Tài chính

        en.filter(d => d.depth > 0).append('circle');

        all.select('g.badge').each(function (d) {

      function toggle(d) {if (!d._children || d.depth === 0) return; d.children = d.children ? null : d._children; update(d)}

      // ---- detail panel / bottom sheet ----

      }, {passive: true});

      // ===== Máy tính / tablet ngang: thanh chia kéo dãn độ rộng bảng chi tiết =====
      const split = document.getElementById('split'), PW_KEY = 'sceoPanelW';
      const pwMax = () => Math.max(280, mainEl.clientWidth * .7);
      function setPanelW(w) {panel.style.setProperty('--panel-w', Math.round(Math.max(240, Math.min(pwMax(), w))) + 'px'); panel.classList.remove('collapsed')}
      function savePanel() {try {localStorage.setItem(PW_KEY, panel.classList.contains('collapsed') ? '0' : (parseInt(panel.style.getPropertyValue('--panel-w')) || ''))} catch (e) { }}
      function togglePanel() {panel.classList.toggle('collapsed'); savePanel(); split.setAttribute('aria-expanded', !panel.classList.contains('collapsed'))}
      split.addEventListener('pointerdown', e => {
        if (isM()) return; e.preventDefault();
        split.setPointerCapture(e.pointerId); split.classList.add('on'); appEl.classList.add('resizing');

        // kéo sát mép phải → ẩn hẳn, nhưng nhớ độ rộng lúc bắt đầu kéo để nhấp đúp mở lại đúng cỡ cũ

      }));
