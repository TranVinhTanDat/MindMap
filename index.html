  <meta charset="utf-8">

  <meta property="og:title" content="Mindmap SCEO · Chuỗi cung ứng toàn diện">
  <meta property="og:description" content="Sơ đồ tư duy ôn tập 9 chương VILAS SC Essentials – công thức, ví dụ, thuật ngữ, lỗi slide.">
  <meta property="og:url" content="https://tranvinhtandat.github.io/MindMap/">
  <meta property="og:image" content="https://tranvinhtandat.github.io/MindMap/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0
    }

    [hidden] {
      display: none !important
    }

    /* Layout: thanh công cụ trên cùng · khung sơ đồ cây kéo/zoom được bên trái · bảng chi tiết bên phải (dưới cùng trên điện thoại) */
    :root {
      --bg: #f3f5f4;
      --surface: #ffffff;
      --ink: #18221f;
      --muted: #5b6964;
      --line: #d5ddda;
      --accent: #0f6b5c;
      --accent-soft: #dcefe9;
      --warn: #a3470f;
      --warn-soft: #fbeadd;
      --f-bg: #eef2f9;
      --f-ink: #203a6b;
      --c1: #0f6b5c;
      --c2: #2457a6;
      --c3: #b0366b;
      --c4: #b8620b;
      --c5: #6b46b5;
      --c6: #0e7c9a;
      --c7: #7a6a0d;
      --c8: #b3261e;
      --c9: #3d6e22;
      --c10: #8a5a2b;
      --c11: #2c3e91;
      --c12: #8e44ad;
      --c13: #c2410c;
      --cx: #4a5560;
      --grid: #d3dcd8;
      --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111816;
        --surface: #19221f;
        --ink: #e4ece9;
        --muted: #9aaba5;
        --line: #2e3b37;
        --accent: #5cc7b0;
        --accent-soft: #1d3a33;
        --warn: #f0a26a;
        --warn-soft: #3a2617;
        --f-bg: #1b2436;
        --f-ink: #b9cdf5;
        --c1: #4fc2a9;
        --c2: #7aa7ef;
        --c3: #ec7fae;
        --c4: #f0a34f;
        --c5: #b39af0;
        --c6: #58c4e0;
        --c7: #d6c35a;
        --c8: #f2867d;
        --c9: #93cc6d;
        --c10: #d6a26b;
        --c11: #93a6f2;
        --c12: #c992e6;
        --c13: #f39a62;
        --c10: #d6a26b;
      --c11: #93a6f2;
      --c12: #c992e6;
      --c13: #f39a62;
      --cx: #a7b3bd;
      --grid: #26332f;
        --grid: #26332f;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #111816;
      --surface: #19221f;
      --ink: #e4ece9;
      --muted: #9aaba5;
      --line: #2e3b37;
      --accent: #5cc7b0;
      --accent-soft: #1d3a33;
      --warn: #f0a26a;
      --warn-soft: #3a2617;
      --f-bg: #1b2436;
      --f-ink: #b9cdf5;
      --c1: #4fc2a9;
      --c2: #7aa7ef;
      --c3: #ec7fae;
      --c4: #f0a34f;
      --c5: #b39af0;
      --c6: #58c4e0;
      --c7: #d6c35a;
      --c8: #f2867d;
      --c9: #93cc6d;
      --cx: #a7b3bd;
      color-scheme: dark
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      padding-block: 12px;
      padding-inline: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface)
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
      margin-right: auto
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
      text-wrap: balance
    }

    .brand span {
      font-size: 12px;
      color: var(--muted)
    }

    .acts {
      display: flex;
      gap: 8px
    }

    .acts .sm {
      display: none
    }

    button,
    .seg button {
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 11px;
      cursor: pointer
    }

    button:hover {
      border-color: var(--accent)
    }

    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    .seg button {
      border: 0;
      border-radius: 0
    }

    .seg button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--surface)
    }

    .search {
      position: relative
    }

    .search input {
      font: inherit;
      font-size: 13px;
      width: 220px;
      max-width: 60vw;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink)
    }

    .results {
      position: absolute;
      top: 110%;
      right: 0;
      width: 340px;
      max-width: 88vw;
      max-height: 60vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
      z-index: 20;
      padding: 4px
    }

    .results button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 6px;
      padding: 7px 9px
    }

    .results button:hover {
      background: var(--accent-soft)
    }

    .results small {
      display: block;
      color: var(--muted);
      font-size: 11px
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-block: 8px;
      padding-inline: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface)
    }

    .chip {
      flex: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 4px 11px;
      border: 1px solid var(--line);
      background: var(--bg)
    }

    .chip i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 1px
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0
    }

    #stage {
      flex: 1;
      min-width: 0;
      position: relative;
      overflow: hidden
    }

    #stage svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none
    }

    .node .ha {
      fill: transparent
    }

    #stage svg:active {
      cursor: grabbing
    }

    /* ---- nút sơ đồ ---- */
    .node text {
      font-family: var(--font);
      font-size: 12.5px;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
      stroke-linejoin: round
    }

    .node.d0 text {
      font-size: 17px;
      font-weight: 800;
      fill: var(--surface);
      stroke: none
    }

    .node .root-box {
      fill: var(--accent);
      filter: drop-shadow(0 4px 10px rgba(15, 107, 92, .28))
    }

    .node.d1 text {
      font-size: 14.5px;
      font-weight: 700;
      stroke: none
    }

    .node .pill {
      fill-opacity: .12;
      stroke-opacity: .5;
      stroke-width: 1.2;
      transition: fill-opacity .15s, stroke-opacity .15s
    }

    .node.d1:hover .pill {
      fill-opacity: .2;
      stroke-opacity: .8
    }

    .node.d2 text {
      font-weight: 600
    }

    .node circle {
      stroke-width: 2
    }

    .node .badge text {
      font: 700 11px var(--font);
      fill: var(--surface) !important;
      stroke: none;
      text-decoration: none !important
    }

    .node .badge rect {
      opacity: .92
    }

    .node:hover .badge rect {
      opacity: 1
    }

    .node {
      cursor: pointer
    }

    .node:hover text {
      fill: var(--accent)
    }

    .node.d0:hover text {
      fill: var(--surface)
    }

    .node.sel text {
      fill: var(--accent);
      font-weight: 700
    }

    .node.d0.sel text,
    .node.d1.sel text,
    .node.d1:hover text {
      fill: var(--ink)
    }

    .node.d0.sel text {
      fill: var(--surface)
    }

    .node.sel .pill {
      fill-opacity: .24;
      stroke-opacity: 1;
      stroke-width: 2
    }

    .node.d0.sel .root-box {
      stroke: var(--ink);
      stroke-width: 2.5;
      stroke-opacity: .35
    }

    .node.hit text {
      text-decoration: underline
    }

    /* đường nối: dày ở gốc, mảnh dần về ngọn */
    .link {
      fill: none;
      stroke-opacity: .55;
      stroke-width: 1.3;
      stroke-linecap: round
    }

    .link.l1 {
      stroke-width: 2.8;
      stroke-opacity: .6
    }

    .link.l2 {
      stroke-width: 1.8
    }

    /* lưới chấm nền – vị trí/kích thước do JS cập nhật theo zoom */
    #stage {
      background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.3px);
      background-size: 24px 24px
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 12px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 9px;
      transition: opacity .4s
    }

    .hint.gone {
      opacity: 0;
      pointer-events: none
    }

    .zoom {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .zoom button {
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 16px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .10)
    }

    .zoom .pct {
      font: 600 10.5px var(--mono);
      color: var(--muted);
      text-align: center;
      padding: 2px 0
    }

    /* Chặn trình duyệt phóng to CẢ TRANG bằng 2 ngón (giao diện sẽ vỡ);
       riêng khung sơ đồ (touch-action:none) do d3 tự xử lý chụm/kéo */
    body.mapmode {
      touch-action: pan-x pan-y
    }

    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%
    }

    /* Thanh chia kéo dãn giữa sơ đồ và bảng chi tiết (máy tính, tablet ngang) */
    .split {
      flex: none;
      width: 10px;
      margin-inline: -5px;
      position: relative;
      z-index: 4;
      cursor: col-resize;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .split::before {
      content: "";
      width: 4px;
      height: 44px;
      border-radius: 3px;
      background: var(--line);
      transition: background .15s, height .15s
    }

    .split:hover::before,
    .split:focus-visible::before,
    .split.on::before {
      background: var(--accent);
      height: 72px
    }

    .split:focus-visible {
      outline: none
    }

    @media (pointer:coarse) {
      .split {
        width: 24px;
        margin-inline: -12px
      }
    }

    /* điều hướng bằng bàn phím trên sơ đồ */
    .node:focus {
      outline: none
    }

    .node:focus-visible circle {
      stroke-width: 4px
    }

    .node:focus-visible text {
      fill: var(--accent);
      text-decoration: underline
    }

    .app.resizing,
    .app.resizing * {
      cursor: col-resize !important;
      user-select: none !important
    }

    .app.resizing aside,
    aside.dragging {
      transition: none !important
    }

    @media (min-width:821px) {
      aside.collapsed {
        width: 0 !important;
        border-left: 0;
        overflow: hidden
      }
    }

    /* Chế độ tập trung: ẩn header + chip để sơ đồ chiếm trọn màn hình */
    .app.focus header,
    .app.focus .chips {
      display: none
    }

    aside {
      --pw-def: 380px;
      width: var(--panel-w, var(--pw-def));
      flex: none;
      border-left: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    aside .handle {
      display: none
    }

    #panelBody {
      flex: 1;
      overflow: auto;
      overscroll-behavior: contain;
      padding-block: 18px;
      padding-inline: 20px
    }

    .crumb {
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .crumb a {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer
    }

    .crumb a:hover {
      color: var(--accent)
    }

    aside h2 {
      font-size: 19px;
      line-height: 1.3;
      margin: 0 0 10px;
      text-wrap: balance
    }

    .tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 2px 7px;
      margin: 0 6px 10px 0
    }

    .tag.f {
      background: var(--f-bg);
      color: var(--f-ink)
    }

    .tag.vd {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .tag.w {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .tag.x {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line)
    }

    .detail p {
      margin: 0 0 8px;
      max-width: 62ch
    }

    .detail a,
    #outline .od a {
      color: var(--accent);
      font-weight: 600;
      overflow-wrap: anywhere
    }

    .detail ul {
      margin: 0 0 8px;
      padding-left: 18px
    }

    .detail li {
      margin-bottom: 3px
    }

    .detail code,
    .fx {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--f-bg);
      color: var(--f-ink);
      border-radius: 5px;
      padding: 1px 5px
    }

    .fx {
      display: block;
      padding: 8px 10px;
      margin: 4px 0 10px;
      white-space: pre-wrap
    }

    .kids h3 {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 6px
    }

    .kids button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
      font-size: 13px;
      border-left: 3px solid var(--kc, var(--line));
      transition: background .15s, transform .15s
    }

    .kids button span {
      flex: 1;
      min-width: 0
    }

    .kids button small {
      flex: none;
      font: 600 11.5px var(--font);
      white-space: nowrap;
      color: var(--muted);
      background: var(--bg);
      border-radius: 999px;
      padding: 1px 7px
    }

    .kids button:hover {
      background: var(--accent-soft);
      transform: translateX(2px)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .legend h3 {
      width: 100%;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 16px 0 0
    }

    .legend b {
      color: var(--ink);
      margin-right: 3px
    }

    .legend .cnt {
      font: 700 11px var(--mono);
      background: var(--bg);
      border-radius: 999px;
      padding: 0 6px
    }

    .empty {
      color: var(--muted)
    }

    #outline {
      flex: 1;
      overflow: auto;
      padding-block: 16px;
      padding-inline: 16px
    }

    #outline .wrap {
      max-width: 900px;
      margin: 0 auto
    }

    #outline details {
      border-left: 2px solid var(--line);
      margin: 3px 0 3px 4px;
      padding-left: 12px
    }

    #outline summary {
      cursor: pointer;
      font-weight: 600;
      padding: 2px 0
    }

    #outline .lvl1>summary {
      font-size: 16px;
      font-weight: 800
    }

    #outline .leaf {
      margin: 3px 0 3px 4px;
      padding-left: 14px;
      border-left: 2px solid var(--line)
    }

    #outline .leaf b {
      font-weight: 600
    }

    #outline .od {
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0 6px
    }

    #outline .od p {
      margin: 0 0 4px
    }

    /* ===== Responsive =====
       ≥1600: panel rộng · 1101–1599: mặc định · 821–1100: panel hẹp
       ≤820 (điện thoại, tablet dọc): sơ đồ toàn màn hình + ngăn kéo chi tiết từ dưới lên
       màn hình thấp (điện thoại xoay ngang): header 1 dòng gọn */
    @media (min-width:1600px) {
      aside {
        --pw-def: 440px
      }
    }

    @media (min-width:821px) and (max-width:1100px) {
      aside {
        --pw-def: 320px
      }

      .search input {
        width: 180px
      }
    }

    @media (min-width:821px) and (max-height:560px) {
      header {
        padding-block: 6px;
        flex-wrap: nowrap
      }

      .brand span {
        display: none
      }

      .brand h1 {
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }

      .acts .lg {
        display: none
      }

      .acts .sm {
        display: inline
      }

      .search input {
        width: 170px
      }

      .chips {
        padding-block: 5px
      }

      aside {
        --pw-def: 300px
      }

      #panelBody {
        padding: 12px 14px
      }

      .hint {
        display: none
      }
    }

    @media (max-width:820px) {
      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "brand seg" "search acts";
        gap: 8px;
        padding: 8px 12px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right))
      }

      .brand {
        grid-area: brand;
        margin: 0;
        justify-content: center
      }

      .brand h1 {
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }

      .brand span {
        display: none
      }

      .seg {
        grid-area: seg
      }

      .seg button {
        flex: 1
      }

      .acts {
        grid-area: acts;
        gap: 6px
      }

      .acts .lg {
        display: none
      }

      .acts .sm {
        display: inline
      }

      .search {
        grid-area: search;
        min-width: 0;
        position: static
      }

        right: 0;

      aside[data-state="peek"] {

      }

      aside[data-state="peek"] #panelBody {

      aside[data-state="peek"] .tag,

      aside h2 {

      .kids button {

      /* nút zoom & dòng hướng dẫn luôn nằm ngay trên mép ngăn kéo (đi theo khi kéo ngăn kéo) */

        right: 10px;

      .zoom button {

        height: 42px;
        font-size: 18px
      }

      .hint {
        left: 12px;
        right: 64px;
        bottom: calc(var(--sheet-px, 76px) + 12px);

      }

      .split {

      .node text {

      }

      .node.d1 text {

      #outline {

      #outline summary {

      #outline details,
      #outline .leaf {

      #outline .od {

    @media (max-width:360px) {

    /* màn hình thấp: ẩn % zoom cho đỡ chật */
    @media (max-height:560px) {

    /* In / lưu PDF (Ctrl+P): in toàn bộ Dàn ý đã mở hết, bỏ sơ đồ & nút điều khiển */

    .chip[aria-current] {
